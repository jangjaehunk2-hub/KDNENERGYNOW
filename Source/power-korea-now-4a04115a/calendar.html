<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>절전 챌린지 달력</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <style>
    .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 140px;
            height: 100vh;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            z-index: 1000;
        }
        .sidebar-button {
            width: 100%;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sidebar-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .sidebar-button.active {
            background-color: rgba(255, 255, 255, 0.1);
            border-left: 4px solid #0066ff;
        }
        .sidebar-button i {
            font-size: 24px;
        }
        .sidebar-button span {
            font-size: 14px;
        }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; padding:24px; background:#f7f9fc; color:#111; margin-left:140px; }
    .container { max-width:900px; margin:0 auto; }
    h1 { margin-bottom:24px; font-size:24px; text-align:center; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
    .nav-btn { padding:8px 12px; border:1px solid #d6dde6; background:#fff; border-radius:6px; cursor:pointer; }
    .nav-btn:hover { background:#f2f6fb; }
    .month-year { font-size:18px; font-weight:600; }
    .calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:24px; }
    .weekday { text-align:center; font-weight:600; color:#666; padding:12px 0; font-size:13px; }
    .day { background:#fff; border:1px solid #d6dde6; border-radius:8px; padding:12px; min-height:100px; cursor:pointer; position:relative; transition:all 0.2s; }
    .day:hover { border-color:#0366d6; box-shadow:0 2px 8px rgba(3,102,214,0.1); }
    .day.other-month { background:#f7f9fc; color:#999; }
    .day.today { background:#e6f2ff; border-color:#0366d6; }
    .day.selected { background:#0366d6; color:#fff; }
    .day-num { font-weight:600; margin-bottom:4px; }
    .day-badges { display:flex; gap:4px; flex-wrap:wrap; }
    .badge { display:inline-block; width:20px; height:20px; border-radius:50%; font-size:10px; line-height:20px; text-align:center; font-weight:600; }
    .badge.air { background:#4CAF50; color:#fff; title: "에어컨"; }
    .badge.off { background:#2196F3; color:#fff; title: "전등"; }
    .badge.power { background:#FF9800; color:#fff; title: "대기전력"; }
    .badge.efficiency { background:#9C27B0; color:#fff; title: "효율"; }
    .detail-panel { background:#fff; border:1px solid #d6dde6; border-radius:8px; padding:20px; }
    .detail-title { font-size:16px; font-weight:600; margin-bottom:12px; }
    .detail-date { color:#666; font-size:13px; margin-bottom:16px; }
    .task { background:#f7f9fc; border-left:3px solid #0366d6; padding:12px; margin-bottom:12px; border-radius:4px; }
    .task-name { font-weight:600; margin-bottom:4px; }
    .task.completed { opacity:0.8; background:#e6fbef; }
    .task.completed .task-name { text-decoration:line-through; }
    .read-only { color:#999; font-size:13px; margin-top:8px; }
    .btn { padding:8px 12px; background:#0366d6; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:13px; }
    .btn:hover { background:#024a9a; }
    .btn.secondary { background:#6c757d; }
    .btn.secondary:hover { background:#545b62; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .today-btn { padding:8px 12px; background:#0366d6; color:#fff; border:none; border-radius:6px; cursor:pointer; }
    .today-btn:hover { background:#024a9a; }
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:2000; }
    .modal.active { display:flex; }
    .modal-content { background:#fff; border-radius:8px; padding:24px; max-width:600px; width:90%; max-height:80vh; overflow-y:auto; }
    .modal-header { font-size:18px; font-weight:600; margin-bottom:16px; }
    .modal-body { margin-bottom:16px; }
    .modal-footer { display:flex; gap:8px; justify-content:flex-end; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
    .stat-card { background:#f7f9fc; border:1px solid #d6dde6; border-radius:8px; padding:12px; text-align:center; }
    .stat-num { font-size:24px; font-weight:600; color:#0366d6; }
    .stat-label { font-size:12px; color:#666; margin-top:4px; }
    .method-energy { font-size:11px; background:#fff3cd; color:#856404; padding:8px; border-radius:4px; margin-bottom:12px; }
    .user-info { padding:12px; background:#f7f9fc; border-radius:6px; margin-bottom:16px; font-size:13px; }
    .loading { text-align:center; color:#666; padding:20px; }
    .error { background:#ffebee; color:#c62828; padding:12px; border-radius:6px; margin-bottom:12px; }
  </style>
</head>
<body>
  <!-- ===== 사이드바 ===== -->
  <aside class="sidebar">
      <button class="sidebar-button" onclick="window.location.href='index.html'">
          <i class='bx bx-map'></i>
          <span>Map</span>
      </button>
      <button class="sidebar-button" onclick="window.location.href='slide.html'">
          <i class='bx bx-slider'></i>
          <span>Slide</span>
      </button>
      <button class="sidebar-button active" onclick="window.location.href='calendar.html'">
          <i class='bx bx-calendar'></i>
          <span>Calendar</span>
      </button>
      <button class="sidebar-button" onclick="window.location.href='education.html'">
          <i class='bx bx-book-reader'></i>
          <span>Education</span>
      </button>
      <button class="sidebar-button" onclick="window.location.href='login.html'">
          <i class='bx bx-log-in'></i>
          <span>Login</span>
      </button>
  </aside>
  <div class="container">
    <h1>절전 챌린지 달력</h1>
    
    <div id="userSection" class="user-info" style="display:none;">
      사용자: <strong id="userName"></strong>
    </div>

    <div class="header">
      <button class="nav-btn" id="prevMonth">이전</button>
      <div class="month-year" id="monthYear"></div>
      <button class="nav-btn" id="nextMonth">다음 ></button>
      <button class="today-btn" id="todayBtn">오늘</button>
      <button class="btn" id="openChallengeBtn">절전 챌린지 시작</button>
    </div>

    <div class="stats" id="statsContainer"></div>

    <div class="calendar" id="calendar"></div>

    <div class="detail-panel">
      <div class="detail-title">선택된 날짜</div>
      <div class="detail-date" id="selectedDate">날짜를 선택하세요</div>
      <div id="tasksContainer"></div>
    </div>
  </div>

  <!-- 절전 챌린지 모달 -->
  <div class="modal" id="challengeModal">
    <div class="modal-content">
      <div class="modal-header">오늘의 절전 챌린지</div>
      <div class="modal-body">
        <div class="method-energy" id="methodEnergyInfo">실천한 항목을 선택하세요</div>
        <div style="margin-bottom:16px;">
          <label style="display:block; margin-bottom:8px; font-weight:600;">절전 방법을 선택하세요</label>
          <div style="background:#f7f9fc; padding:12px; border-radius:4px;">
            <div style="margin-bottom:8px;"><input type="checkbox" id="stamp_air" /> <label for="stamp_air">에어컨 온도 조절</label></div>
            <div style="margin-bottom:8px;"><input type="checkbox" id="stamp_off" /> <label for="stamp_off">불필요한 전등 끄기</label></div>
            <div style="margin-bottom:8px;"><input type="checkbox" id="stamp_power" /> <label for="stamp_power">대기전력 제거</label></div>
            <div style="margin-bottom:8px;"><input type="checkbox" id="stamp_efficiency" /> <label for="stamp_efficiency">에너지 효율 가전 사용</label></div>
          </div>
        </div>
        <div>
          <label style="display:block; margin-bottom:8px; font-weight:600;">절감 전력량 (kWh)</label>
          <input type="number" id="saveKwh" placeholder="절감 전력량 입력" style="width:100%; padding:8px; border:1px solid #d6dde6; border-radius:4px;" min="0" step="0.1" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn secondary" id="closeChallengeModal">취소</button>
        <button class="btn" id="deleteChallengeBtn">삭제</button>
        <button class="btn" id="saveChallengeBtn">저장</button>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let selectedDate = null;
    let currentUser = null;

    // 로그인 사용자 확인
    function initUser() {
      const user = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user'));
      if (!user) {
        alert('로그인이 필요합니다.');
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      document.getElementById('userName').textContent = user.nick_name || user.user_id;
      document.getElementById('userSection').style.display = 'block';
    }

    // API 함수들
    async function fetchChallengeData(userId) {
      try {
        const res = await fetch(`/api/challenge/${userId}`);
        if (!res.ok) throw new Error('데이터 조회 실패');
        const json = await res.json();
        return json.data || [];
      } catch (err) {
        console.error('❌ 절전 챌린지 조회 오류:', err);
        return [];
      }
    }

    async function saveChallengeData(challengeData) {
      try {
        const res = await fetch('/api/challenge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(challengeData)
        });
        if (!res.ok) throw new Error('데이터 저장 실패');
        const json = await res.json();
        return json;
      } catch (err) {
        console.error('❌ 절전 챌린지 저장 오류:', err);
        alert('저장 실패: ' + err.message);
        return null;
      }
    }

    async function deleteChallengeData(userId, date) {
      try {
        const res = await fetch(`/api/challenge/${userId}/${date}`, {
          method: 'DELETE'
        });
        if (!res.ok) throw new Error('데이터 삭제 실패');
        return await res.json();
      } catch (err) {
        console.error('❌ 절전 챌린지 삭제 오류:', err);
        alert('삭제 실패: ' + err.message);
        return null;
      }
    }

    async function fetchStats(userId) {
      try {
        const res = await fetch(`/api/challenge-stats/${userId}`);
        if (!res.ok) throw new Error('통계 조회 실패');
        const json = await res.json();
        return json.data || {};
      } catch (err) {
        console.error('❌ 통계 조회 오류:', err);
        return {};
      }
    }

    // 데이터 변환 함수
    function convertDBToObject(dbData) {
      const obj = {};
      dbData.forEach(row => {
        const date = row.challenge_date;
        obj[date] = {
          stamps: {
            air: row.stamp_air === 'O',
            off: row.stamp_off === 'O',
            power: row.stamp_power === 'O',
            efficiency: row.stamp_efficiency === 'O'
          },
          saveKwh: row.save_kwh || 0
        };
      });
      return obj;
    }

    function getDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getTodayKey() {
      return getDateKey(new Date());
    }

    let challengeData = {};

    async function loadData() {
      if (!currentUser) return;
      challengeData = convertDBToObject(await fetchChallengeData(currentUser.user_id));
      renderStats();
      renderCalendar();
    }

    function renderStats() {
      const stats = {
        totalDays: 0,
        airCount: 0,
        offCount: 0,
        powerCount: 0,
        efficiencyCount: 0,
        totalKwh: 0
      };

      Object.values(challengeData).forEach(day => {
        stats.totalDays++;
        if (day.stamps.air) stats.airCount++;
        if (day.stamps.off) stats.offCount++;
        if (day.stamps.power) stats.powerCount++;
        if (day.stamps.efficiency) stats.efficiencyCount++;
        stats.totalKwh += day.saveKwh;
      });

      const statsEl = document.getElementById('statsContainer');
      statsEl.innerHTML = `
        <div class="stat-card">
          <div class="stat-num">${stats.totalDays}</div>
          <div class="stat-label">실천한 날</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${stats.airCount}</div>
          <div class="stat-label">에어컨 조절</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${stats.offCount}</div>
          <div class="stat-label">전등 끄기</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${stats.powerCount}</div>
          <div class="stat-label">대기전력</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${stats.efficiencyCount}</div>
          <div class="stat-label">효율 가전</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${stats.totalKwh.toFixed(2)}</div>
          <div class="stat-label">총 절감 (kWh)</div>
        </div>
      `;
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      const firstDay = new Date(year, month, 1);
      const startDate = new Date(firstDay);
      startDate.setDate(startDate.getDate() - firstDay.getDay());

      document.getElementById('monthYear').textContent = `${year}년 ${month + 1}월`;

      const calendarEl = document.getElementById('calendar');
      calendarEl.innerHTML = '';

      const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
      weekdays.forEach(day => {
        const el = document.createElement('div');
        el.className = 'weekday';
        el.textContent = day;
        calendarEl.appendChild(el);
      });

      const today = getTodayKey();
      let date = new Date(startDate);

      for (let i = 0; i < 42; i++) {
        const dayEl = document.createElement('div');
        dayEl.className = 'day';

        if (date.getMonth() !== month) {
          dayEl.classList.add('other-month');
        }

        const dateKey = getDateKey(date);
        const dayData = challengeData[dateKey];

        if (dateKey === today) {
          dayEl.classList.add('today');
        }

        const dayNumEl = document.createElement('div');
        dayNumEl.className = 'day-num';
        dayNumEl.textContent = date.getDate();
        dayEl.appendChild(dayNumEl);

        const badgesEl = document.createElement('div');
        badgesEl.className = 'day-badges';
        
        if (dayData) {
          if (dayData.stamps.air) {
            const badge = document.createElement('div');
            badge.className = 'badge air';
            badge.textContent = '냉';
            badgesEl.appendChild(badge);
          }
          if (dayData.stamps.off) {
            const badge = document.createElement('div');
            badge.className = 'badge off';
            badge.textContent = '전';
            badgesEl.appendChild(badge);
          }
          if (dayData.stamps.power) {
            const badge = document.createElement('div');
            badge.className = 'badge power';
            badge.textContent = '대';
            badgesEl.appendChild(badge);
          }
          if (dayData.stamps.efficiency) {
            const badge = document.createElement('div');
            badge.className = 'badge efficiency';
            badge.textContent = '효';
            badgesEl.appendChild(badge);
          }
        }
        dayEl.appendChild(badgesEl);

        dayEl.addEventListener('click', () => selectDate(new Date(date)));

        calendarEl.appendChild(dayEl);
        date.setDate(date.getDate() + 1);
      }

      updateDetailPanel();
    }

    function selectDate(date) {
      selectedDate = new Date(date);
      renderCalendar();
      updateDetailPanel();
    }

    function updateDetailPanel() {
      const dateEl = document.getElementById('selectedDate');
      const tasksEl = document.getElementById('tasksContainer');
      tasksEl.innerHTML = '';

      if (!selectedDate) {
        dateEl.textContent = '날짜를 선택하세요';
        return;
      }

      const dateKey = getDateKey(selectedDate);
      const dayData = challengeData[dateKey];
      const today = getTodayKey();
      const isToday = dateKey === today;

      const y = selectedDate.getFullYear();
      const m = selectedDate.getMonth() + 1;
      const d = selectedDate.getDate();
      dateEl.textContent = `${y}년 ${m}월 ${d}일 ${['일', '월', '화', '수', '목', '금', '토'][selectedDate.getDay()]}요일`;

      const taskEl = document.createElement('div');
      taskEl.className = 'task' + (dayData ? ' completed' : '');
      
      let content = '<div class="task-name">절전 챌린지</div>';
      
      if (dayData) {
        const methods = [];
        if (dayData.stamps.air) methods.push('에어컨 조절');
        if (dayData.stamps.off) methods.push('전등 끄기');
        if (dayData.stamps.power) methods.push('대기전력 제거');
        if (dayData.stamps.efficiency) methods.push('효율 가전');
        
        content += `<div style="font-size:13px; color:#2e7d32; margin:8px 0; font-weight:600;">✓ 절감: ${dayData.saveKwh.toFixed(2)} kWh</div>`;
        if (methods.length > 0) {
          content += `<div style="font-size:12px; color:#666; margin:8px 0;">방법: ${methods.join(', ')}</div>`;
        }
      }
      
      content += `<div style="margin-top:8px;">${isToday ? '<button class="btn" style="width:100%;" data-action="edit">수정하기</button>' : '<span class="read-only">' + (dayData ? '완료됨' : '미완료') + ' (오늘만 수정 가능)</span>'}</div>`;
      
      taskEl.innerHTML = content;
      tasksEl.appendChild(taskEl);

      tasksEl.querySelector('button[data-action="edit"]')?.addEventListener('click', openChallengeModal);
    }

    function openChallengeModal() {
      const today = getTodayKey();
      const dayData = challengeData[today];

      document.getElementById('stamp_air').checked = dayData?.stamps.air || false;
      document.getElementById('stamp_off').checked = dayData?.stamps.off || false;
      document.getElementById('stamp_power').checked = dayData?.stamps.power || false;
      document.getElementById('stamp_efficiency').checked = dayData?.stamps.efficiency || false;
      document.getElementById('saveKwh').value = dayData?.saveKwh || '';

      updateMethodEnergyInfo();
      document.getElementById('challengeModal').classList.add('active');
    }

    function updateMethodEnergyInfo() {
      const saveKwh = parseFloat(document.getElementById('saveKwh').value) || 0;
      const infoEl = document.getElementById('methodEnergyInfo');
      infoEl.innerHTML = `절감 전력량: <strong style="color:#0366d6; font-size:14px;">${saveKwh.toFixed(2)} kWh</strong>`;
    }

    document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', updateMethodEnergyInfo);
    });
    document.getElementById('saveKwh').addEventListener('input', updateMethodEnergyInfo);

    document.getElementById('openChallengeBtn').addEventListener('click', openChallengeModal);
    document.getElementById('closeChallengeModal').addEventListener('click', () => {
      document.getElementById('challengeModal').classList.remove('active');
    });

    document.getElementById('saveChallengeBtn').addEventListener('click', async () => {
      const today = getTodayKey();
      const saveKwh = parseFloat(document.getElementById('saveKwh').value) || 0;

      if (saveKwh === 0 && !document.getElementById('stamp_air').checked && 
          !document.getElementById('stamp_off').checked && 
          !document.getElementById('stamp_power').checked && 
          !document.getElementById('stamp_efficiency').checked) {
        alert('절감 전력량 또는 절전 방법을 선택해주세요.');
        return;
      }

      const data = {
        user_id: currentUser.user_id,
        challenge_date: today,
        stamp_air: document.getElementById('stamp_air').checked ? 'O' : 'X',
        stamp_off: document.getElementById('stamp_off').checked ? 'O' : 'X',
        stamp_power: document.getElementById('stamp_power').checked ? 'O' : 'X',
        stamp_efficiency: document.getElementById('stamp_efficiency').checked ? 'O' : 'X',
        save_kwh: saveKwh
      };

      const result = await saveChallengeData(data);
      if (result?.success) {
        alert('저장되었습니다.');
        document.getElementById('challengeModal').classList.remove('active');
        await loadData();
      }
    });

    document.getElementById('deleteChallengeBtn').addEventListener('click', async () => {
      const today = getTodayKey();
      if (confirm('이 날짜의 데이터를 삭제하시겠습니까?')) {
        const result = await deleteChallengeData(currentUser.user_id, today);
        if (result?.success) {
          alert('삭제되었습니다.');
          document.getElementById('challengeModal').classList.remove('active');
          await loadData();
        }
      }
    });

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      currentDate = new Date();
      selectedDate = new Date();
      renderCalendar();
      updateDetailPanel();
    });

    // 초기화
    initUser();
    loadData();
  </script>
</body>
</html>
