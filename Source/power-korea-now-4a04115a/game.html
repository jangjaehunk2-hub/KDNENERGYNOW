<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ 발전량 예측 게임</title>

<!-- Boxicons (사이드바 아이콘용) -->
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

<style>
/* 전체 레이아웃 */
body {
  font-family: 'Arial', sans-serif;
  background: #f5f5f5;
  margin: 0;
  display: flex;
  height: 100vh;
}

/* ===== 사이드바 ===== */
.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 140px;
    height: 100vh;
    background-color: #1a1a1a;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
    z-index: 1000;
}

/* 사이드바 버튼 기본 스타일 */
.sidebar-button {
    width: 100%;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    border: none;
    background: transparent;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
}

/* 마우스를 올렸을 때 효과 */
.sidebar-button:hover {
    background-color: rgba(255, 255, 255, 0.1);
}

/* 현재 선택된 버튼 (왼쪽 파란색 선 표시) */
.sidebar-button.active {
    background-color: rgba(255, 255, 255, 0.1);
    border-left: 4px solid #0066ff;
}

/* 아이콘 크기 */
.sidebar-button i {
    font-size: 24px;
}

/* 버튼 아래 글자 스타일 */
.sidebar-button span {
    font-size: 14px;
}


/* ===== 메인 컨텐츠 영역 ===== */
.main-content {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  margin-left: 140px;
}

.container { max-width:900px; margin:auto; }
.card { background:white; border-radius:16px; box-shadow:0 6px 20px rgba(0,0,0,0.1); padding:25px; margin-bottom:25px; transition:0.3s; }
.card:hover { box-shadow:0 8px 25px rgba(0,0,0,0.2); }
h1 { text-align:center; color:#4f46e5; margin-bottom:10px; font-size:2.5rem; }
h2 { text-align:center; color:#2563eb; margin-bottom:10px; }
.grid { display:grid; gap:15px; }
.grid-3 { grid-template-columns:repeat(3,1fr);}
.score-box { text-align:center; padding:20px; border-radius:16px; font-weight:bold; color:white; position:relative; overflow:hidden; }
.score-box::before { content:''; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.05); }
.score-today { background:#2563eb; }
.score-total { background:#4ade80; }
.score-played { background:#f97316; }
button, input[type=number] { font-size:16px; }
button { cursor:pointer; border:none; border-radius:10px; padding:10px 16px; font-weight:bold; transition:0.3s; }
.btn-primary { background-color:#4f46e5; color:white; }
.btn-primary:hover { background-color:#4338ca; }
.btn-secondary { background-color:#e5e7eb; }
.btn-secondary:hover { background-color:#d1d5db; }
input[type=number] { border-radius:10px; padding:8px; border:1px solid #cbd5e1; width:100%; box-sizing:border-box; margin-top:5px;}
.bar-container { display:flex; justify-content:center; align-items:flex-end; gap:50px; height:200px; margin-top:20px; }
.bar { width:60px; border-radius:8px 8px 0 0; transition: height 0.8s; }
.bar-pred { background:#06b6d4; }
.bar-actual { background:#f97316; }
.hint { background:#fef3c7; padding:12px; border-radius:12px; margin-top:12px; text-align:center; font-weight:bold; cursor:pointer; user-select:none; }
/* 예측 입력 + 버튼 한 줄 */
.prediction-container { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.prediction-container input { width:100px; text-align:center; }
.prediction-score { font-size:14px; color:#333; background:#f0f0f0; padding:5px 10px; border-radius:8px; font-weight:bold; white-space:nowrap; }
@media screen and (max-width:600px){
  .grid-3 { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<!-- ===== 사이드바 ===== -->
<aside class="sidebar">
    <button class="sidebar-button" onclick="window.location.href='index.html'">
        <i class='bx bx-map'></i>
        <span>Map</span>
    </button>
    <button class="sidebar-button" onclick="window.location.href='slide.html'">
        <i class='bx bx-slider'></i>
        <span>Slide</span>
    </button>
    <button class="sidebar-button active" onclick="window.location.href='game.html'">
        <i class='bx bx-game'></i>
        <span>Game</span>
    </button>
    <button class="sidebar-button" onclick="window.location.href='education.html'">
        <i class='bx bx-book-reader'></i>
        <span>Education</span>
    </button>
    <button class="sidebar-button" onclick="window.location.href='login.html'">
        <i class='bx bx-log-in'></i>
        <span>Login</span>
    </button>
</aside>


<!-- ===== 메인 게임 영역 ===== -->
<div class="main-content">
  <div class="container">

    <div class="card">
      <h1>⚡ 발전량 예측 게임</h1>
      <p style="text-align:center;">랜덤으로 선택된 지역과 발전원에 대해 발전량을 예측하세요!</p>
    </div>

    <!-- 점수판 -->
    <div class="card grid grid-3">
      <div class="score-box score-today">
        오늘 점수<br><span id="score">0점</span>
      </div>
      <div class="score-box score-total">
        누적 점수<br><span id="totalScore">0점</span>
      </div>
      <div class="score-box score-played">
        플레이 횟수<br><span id="gamesPlayed">0회</span>
      </div>
    </div>

    <!-- 입력 카드 -->
    <div id="inputCard" class="card">
      <p>① 지역: <span id="regionDisplay"></span></p>
      <p>② 발전원: <span id="powerDisplay"></span></p>

      <label style="margin-top:15px;">예측 발전량 (MWh)</label>
      <div class="prediction-container">
        <button onclick="adjustPrediction(-100)">-100</button>
        <input type="number" id="prediction" value="500" min="0" step="100">
        <button onclick="adjustPrediction(100)">+100</button>
        <div class="prediction-score">
          오차 ≤20% → 3점 | 20~50% → 2점 | 그 외 → 1점
        </div>
      </div>

      <div id="hint" class="hint" onclick="revealHint()">🔒 힌트를 보려면 클릭하세요!</div>

      <button onclick="submitPrediction()" class="btn-primary" style="margin-top:15px;width:100%;padding:12px;">예측 제출</button>
    </div>

    <!-- 결과 카드 -->
    <div id="resultCard" class="card" style="display:none;">
      <h2 id="resultMessage"></h2>
      <div class="bar-container">
        <div class="bar bar-pred" id="barPred" style="height:0"></div>
        <div class="bar bar-actual" id="barActual" style="height:0"></div>
      </div>
      <p style="text-align:center;margin-top:10px;">예측: <span id="displayPred">0</span> MWh | 실제: <span id="displayActual">0</span> MWh</p>
      <p style="text-align:center;">오차율: <span id="displayError">0</span>% | 획득 점수: <span id="displayPoints">0</span></p>
      <button onclick="resetGame()" class="btn-secondary" style="margin-top:10px;width:100%;padding:10px;">다시 시작</button>
    </div>

  </div>
</div>

<!-- ===== JS ===== -->
<script>
let totalScore = 0, gamesPlayed = 0;
const userId = localStorage.getItem('userId');
if (!userId) {
    window.location.href = 'login.html';
} else {
    fetch(`http://localhost:3000/get-score?user_id=${userId}`)
      .then(res => res.json())
      .then(data => {
          totalScore = data.score || 0;
          document.getElementById('totalScore').innerText = totalScore + "점";
      });
}

const regions = ['서울','부산','대구','인천','광주','대전','울산','세종','경기','강원','충북','충남','전북','전남','경북','경남','제주'];
const powerTypes = ['태양광','풍력','원자력','수력'];

const region = regions[Math.floor(Math.random()*regions.length)];
const power = powerTypes[Math.floor(Math.random()*powerTypes.length)];
document.getElementById('regionDisplay').innerText = region;
document.getElementById('powerDisplay').innerText = power;

function adjustPrediction(val){
  const input = document.getElementById('prediction');
  input.value = Math.max(0, parseInt(input.value)+val);
}

function generateHint(){
  return Math.floor(Math.random()*300 + 200) + " MWh (전날 같은 시간)";
}

function revealHint(){
  document.getElementById('hint').innerText = generateHint();
}

function submitPrediction(){
  const prediction = parseInt(document.getElementById('prediction').value);
  const actual = Math.floor(Math.random()*300 + 200); 
  const errorRate = Math.abs(prediction-actual)/actual*100;
  const points = errorRate<=20?3: errorRate<=50?2:1;
  totalScore += points; 
  gamesPlayed++;

  document.getElementById('score').innerText = points+"점";
  document.getElementById('totalScore').innerText = totalScore+"점";
  document.getElementById('gamesPlayed').innerText = gamesPlayed+"회";

  // 서버로 점수 전송
  fetch('http://localhost:3000/update-score', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user_id: userId, score: points })
  })
  .then(res => res.json())
  .then(data => {
    if(data.success){
      console.log("DB 업데이트 완료, 현재 누적점수:", data.newScore);
    } else {
      console.error("DB 업데이트 실패:", data.message);
    }
  });

  document.getElementById('displayPred').innerText = prediction;
  document.getElementById('displayActual').innerText = actual;
  document.getElementById('displayError').innerText = errorRate.toFixed(1);
  document.getElementById('displayPoints').innerText = points;

  const maxVal = Math.max(prediction, actual);
  document.getElementById('barPred').style.height = (prediction / maxVal * 200) + "px";
  document.getElementById('barActual').style.height = (actual / maxVal * 200) + "px";

  let msg = errorRate<=5?"완벽합니다! 🎉":errorRate<=15?"좋습니다! 👍":"더 노력해보세요! 💪";
  document.getElementById('resultMessage').innerText = msg;

  document.getElementById('inputCard').style.display = "none";
  document.getElementById('resultCard').style.display="block";
}

function resetGame(){
  document.getElementById('resultCard').style.display="none";
  document.getElementById('inputCard').style.display="block";
  document.getElementById('prediction').value = 500;
  document.getElementById('hint').innerText = "🔒 힌트를 보려면 클릭하세요!";
}
</script>
</body>
</html>
