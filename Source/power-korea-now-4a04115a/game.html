<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ 발전량 예측 게임</title>

<!-- Boxicons (사이드바 아이콘용) -->
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

<style>
/* 전체 레이아웃 */
body {
  font-family: 'Arial', sans-serif;
  background: #f5f5f5;
  margin: 0;
  display: flex;
  height: 100vh;
}

/* ===== 사이드바 ===== */
.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 140px;
    height: 100vh;
    background-color: #1a1a1a;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
    z-index: 1000;
}

/* 사이드바 버튼 기본 스타일 */
.sidebar-button {
    width: 100%;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    border: none;
    background: transparent;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
}

/* 마우스를 올렸을 때 효과 */
.sidebar-button:hover {
    background-color: rgba(255, 255, 255, 0.1);
}

/* 현재 선택된 버튼 (왼쪽 파란색 선 표시) */
.sidebar-button.active {
    background-color: rgba(255, 255, 255, 0.1);
    border-left: 4px solid #0066ff;
}

/* 아이콘 크기 */
.sidebar-button i {
    font-size: 24px;
}

/* 버튼 아래 글자 스타일 */
.sidebar-button span {
    font-size: 14px;
}


/* ===== 메인 컨텐츠 영역 ===== */
.main-content {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  margin-left: 140px;
}

.container { max-width:900px; margin:auto; }
.card { background:white; border-radius:16px; box-shadow:0 6px 20px rgba(0,0,0,0.1); padding:25px; margin-bottom:25px; transition:0.3s; }
.card:hover { box-shadow:0 8px 25px rgba(0,0,0,0.2); }
h1 { text-align:center; color:#4f46e5; margin-bottom:10px; font-size:2.5rem; }
h2 { text-align:center; color:#2563eb; margin-bottom:10px; }
.grid { display:grid; gap:15px; }
.grid-3 { grid-template-columns:repeat(3,1fr);}
.score-box { text-align:center; padding:20px; border-radius:16px; font-weight:bold; color:white; position:relative; overflow:hidden; }
.score-box::before { content:''; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.05); }
.score-today { background:#2563eb; }
.score-total { background:#4ade80; }
.score-played { background:#f97316; }
button, input[type=number] { font-size:16px; }
button { cursor:pointer; border:none; border-radius:10px; padding:10px 16px; font-weight:bold; transition:0.3s; }
.btn-primary { background-color:#4f46e5; color:white; }
.btn-primary:hover { background-color:#4338ca; }
.btn-secondary { background-color:#e5e7eb; }
.btn-secondary:hover { background-color:#d1d5db; }
input[type=number] { border-radius:10px; padding:8px; border:1px solid #cbd5e1; width:100%; box-sizing:border-box; margin-top:5px;}
.bar-container { display:flex; justify-content:center; align-items:flex-end; gap:50px; height:200px; margin-top:20px; }
.bar { width:60px; border-radius:8px 8px 0 0; transition: height 0.8s; }
.bar-pred { background:#06b6d4; }
.bar-actual { background:#f97316; }
.hint { background:#fef3c7; padding:12px; border-radius:12px; margin-top:12px; text-align:center; font-weight:bold; cursor:pointer; user-select:none; }
/* 예측 입력 + 버튼 한 줄 */
.prediction-container { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.prediction-container input { width:100px; text-align:center; }
.prediction-score { font-size:14px; color:#333; background:#f0f0f0; padding:5px 10px; border-radius:8px; font-weight:bold; white-space:nowrap; }

/* 발전소 선택 드롭다운 */
.plant-selector {
  margin-top: 15px;
}
.plant-selector select {
  width: 100%;
  padding: 10px;
  border: 2px solid #cbd5e1;
  border-radius: 10px;
  font-size: 16px;
  background: white;
  cursor: pointer;
  transition: all 0.3s;
}
.plant-selector select:focus {
  outline: none;
  border-color: #4f46e5;
}
.plant-selector select:hover {
  border-color: #94a3b8;
}

.loading {
  text-align: center;
  padding: 20px;
  color: #666;
}

@media screen and (max-width:600px){
  .grid-3 { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<!-- ===== 사이드바 ===== -->
<aside class="sidebar">
    <button class="sidebar-button" onclick="window.location.href='index.html'">
        <i class='bx bx-map'></i>
        <span>Map</span>
    </button>
    <button class="sidebar-button" onclick="window.location.href='slide.html'">
        <i class='bx bx-slider'></i>
        <span>Slide</span>
    </button>
    <button class="sidebar-button active" onclick="window.location.href='game.html'">
        <i class='bx bx-game'></i>
        <span>Game</span>
    </button>
    <button class="sidebar-button" onclick="window.location.href='education.html'">
        <i class='bx bx-book-reader'></i>
        <span>Education</span>
    </button>
    <button class="sidebar-button" onclick="window.location.href='login.html'">
        <i class='bx bx-log-in'></i>
        <span>Login</span>
    </button>
</aside>


<!-- ===== 메인 게임 영역 ===== -->
<div class="main-content">
  <div class="container">

    <div class="card">
      <h1>⚡ 발전량 예측 게임</h1>
      <p style="text-align:center;">실시간 수력 발전소 데이터로 발전량을 예측하세요!</p>
      <p style="text-align:center;font-size:12px;color:#666;">🔌 실시간 API 연동 (한국수력원자력 공공데이터)</p>
    </div>

    <!-- 점수판 -->
    <div class="card grid grid-3">
      <div class="score-box score-today">
        오늘 점수<br><span id="score">0점</span>
      </div>
      <div class="score-box score-total">
        누적 점수<br><span id="totalScore">0점</span>
      </div>
      <div class="score-box score-played">
        플레이 횟수<br><span id="gamesPlayed">0회</span>
      </div>
    </div>

    <!-- 입력 카드 -->
    <div id="inputCard" class="card">
      <label><strong>발전소 선택</strong></label>
      <div class="plant-selector">
        <select id="plantSelect" onchange="selectPlant(this.value)">
          <option value="AH">안흥 (AH)</option>
          <option value="CH">청평 (CH)</option>
          <option value="UA">의암 (UA)</option>
          <option value="HC">화천 (HC)</option>
          <option value="CP">춘천 (CP)</option>
          <option value="SJ">소양강 (SJ)</option>
          <option value="BS">보성강 (BS)</option>
          <option value="PD">파로호 (PD)</option>
          <option value="GS">괴산 (GS)</option>
        </select>
      </div>

      <div id="plantInfo" style="margin-top:20px; display:none;">
        <p><strong>선택된 발전소:</strong> <span id="selectedPlantName"></span></p>
        <p><strong>발전원:</strong> 수력</p>

        <label style="margin-top:15px;">예측 발전량 (MW)</label>
        <div class="prediction-container">
          <button onclick="adjustPrediction(-10)">-10</button>
          <button onclick="adjustPrediction(-1)">-1</button>
          <button onclick="adjustPrediction(-0.1)">-0.1</button>
          <input type="number" id="prediction" value="50" min="0" step="0.1">
          <button onclick="adjustPrediction(0.1)">+0.1</button>
          <button onclick="adjustPrediction(1)">+1</button>
          <button onclick="adjustPrediction(10)">+10</button>
        </div>
        <div class="prediction-score">
          오차 ≤10% → 3점 | 10~30% → 2점 | 그 외 → 1점
        </div>

        <div id="hint" class="hint" onclick="revealHint()">🔒 힌트를 보려면 클릭하세요!</div>

        <button onclick="submitPrediction()" class="btn-primary" style="margin-top:15px;width:100%;padding:12px;">예측 제출</button>
      </div>
    </div>

    <!-- 결과 카드 -->
    <div id="resultCard" class="card" style="display:none;">
      <h2 id="resultMessage"></h2>
      <div class="bar-container">
        <div>
          <div class="bar bar-pred" id="barPred" style="height:0"></div>
          <p style="text-align:center;margin-top:5px;">예측</p>
        </div>
        <div>
          <div class="bar bar-actual" id="barActual" style="height:0"></div>
          <p style="text-align:center;margin-top:5px;">실제</p>
        </div>
      </div>
      <p style="text-align:center;margin-top:10px;">예측: <span id="displayPred">0</span> MW | 실제: <span id="displayActual">0</span> MW</p>
      <p style="text-align:center;">오차율: <span id="displayError">0</span>% | 획득 점수: <span id="displayPoints">0</span></p>
      <button onclick="resetGame()" class="btn-secondary" style="margin-top:10px;width:100%;padding:10px;">다시 시작</button>
    </div>

  </div>
</div>

<!-- ===== JS ===== -->
<script>
let totalScore = 0, gamesPlayed = 0;
let selectedPlant = null;
let actualPowerData = null;
let hintPowerData = null;

const plantNames = {
  'AH': '안흥',
  'CH': '청평',
  'UA': '의암',
  'HC': '화천',
  'CP': '춘천',
  'SJ': '소양강',
  'BS': '보성강',
  'PD': '파로호',
  'GS': '괴산'
};

const plantAvgPower = {
  'AH': 35,   // 안흥
  'CH': 45,   // 청평
  'UA': 40,   // 의암
  'HC': 50,   // 화천
  'CP': 55,   // 춘천
  'SJ': 80,   // 소양강
  'BS': 30,   // 보성강
  'PD': 25,   // 파로호
  'GS': 20    // 괴산
};

// API 설정 - 백엔드 프록시 사용
const USE_REAL_API = true;
const API_URL = 'http://localhost:3000/api/khnp/realtime-json';

// 로그인 체크 및 점수 로드
const userId = localStorage.getItem('userId');
if (!userId) {
    window.location.href = 'login.html';
} else {
    fetch(`http://localhost:3000/get-score?user_id=${userId}`)
      .then(res => res.json())
      .then(data => {
          totalScore = data.score || 0;
          document.getElementById('totalScore').innerText = totalScore + "점";
      })
      .catch(err => {
          console.error('점수 로드 실패:', err);
          totalScore = 0;
      });
}

// 페이지 로드 시 첫 번째 발전소 자동 선택
window.addEventListener('DOMContentLoaded', () => {
  const plantSelect = document.getElementById('plantSelect');
  const firstPlant = Object.keys(plantNames)[0]; // 'AH'
  plantSelect.value = firstPlant;
  selectPlant(firstPlant);
  
  // API 모드 안내
  if (USE_REAL_API) {
    console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
    console.log('🔌 실시간 API 모드로 실행 중');
    console.log('📡 서버: http://localhost:3000');
    console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
  }
});

function selectPlant(plantCode) {
  if (!plantCode) {
    document.getElementById('plantInfo').style.display = 'none';
    selectedPlant = null;
    return;
  }
  
  selectedPlant = plantCode;
  
  // 발전소 정보 표시
  document.getElementById('selectedPlantName').innerText = plantNames[plantCode];
  document.getElementById('plantInfo').style.display = 'block';
  
  // 힌트 초기화
  document.getElementById('hint').innerText = '🔒 힌트를 보려면 클릭하세요!';
  hintPowerData = null;
}

function adjustPrediction(val){
  const input = document.getElementById('prediction');
  input.value = Math.max(0, parseFloat(input.value) + val).toFixed(1);
}

async function fetchPowerData(plantCode) {
  
  // 실제 API 모드 (백엔드 프록시 사용)
  try {
    console.log(`🔌 실시간 API 호출: ${plantCode}`);
    const url = `${API_URL}?genName=${plantCode}`;
    const response = await fetch(url);
    const data = await response.json();
    
    if (data.success && data.genOutput) {
      return data.genOutput;
    } else {
      throw new Error(data.message || 'API 응답 오류');
    }
    
  } catch (error) {
    console.error('⚠️ API 호출 에러:', error.message);
    console.log('→ 시뮬레이션 데이터로 전환');
    // API 실패 시 시뮬레이션 데이터 사용
    const basePower = plantAvgPower[plantCode] || 50;
    const variation = (Math.random() - 0.5) * 0.6;
    return parseFloat((basePower * (1 + variation)).toFixed(1));
  }
}

async function revealHint(){
  if (!selectedPlant) {
    alert('먼저 발전소를 선택해주세요!');
    return;
  }
  
  if (!hintPowerData) {
    document.getElementById('hint').innerText = '⏳ 힌트 데이터 로딩 중...';
    hintPowerData = await fetchPowerData(selectedPlant);
  }
  
  // ✅ 수정: 1 미만일 때는 절대값 범위로 힌트 제공
  let hintMin, hintMax, hintText;
  
  if (hintPowerData < 1) {
    // 발전량이 1 미만일 때: ±0.2 MW 범위
    hintMin = Math.max(0, hintPowerData - 0.2).toFixed(1);
    hintMax = (hintPowerData + 0.2).toFixed(1);
    hintText = `💡 어제 발전량: ${hintMin}~${hintMax} MW 사이`;
  } else if (hintPowerData < 5) {
    // 발전량이 1~5 미만일 때: ±1 MW 범위
    hintMin = Math.max(0, hintPowerData - 1).toFixed(1);
    hintMax = (hintPowerData + 1).toFixed(1);
    hintText = `💡 어제 발전량: ${hintMin}~${hintMax} MW 사이`;
  } else {
    // 발전량이 5 이상일 때: ±15% 범위
    hintMin = (hintPowerData * 0.85).toFixed(1);
    hintMax = (hintPowerData * 1.15).toFixed(1);
    hintText = `💡 어제 발전량: ${hintMin}~${hintMax} MW 사이`;
  }
  
  document.getElementById('hint').innerText = hintText;
}

async function submitPrediction(){
  if (!selectedPlant) {
    alert('먼저 발전소를 선택해주세요!');
    return;
  }

  // 실제 발전량 데이터 가져오기
  document.getElementById('inputCard').style.opacity = '0.6';
  actualPowerData = await fetchPowerData(selectedPlant);
  document.getElementById('inputCard').style.opacity = '1';
  
  const prediction = parseFloat(document.getElementById('prediction').value);
  const actual = actualPowerData;
  
  const errorRate = Math.abs(prediction - actual) / actual * 100;
  const points = errorRate <= 10 ? 3 : errorRate <= 30 ? 2 : 1;
  
  totalScore += points; 
  gamesPlayed++;

  document.getElementById('score').innerText = points + "점";
  document.getElementById('totalScore').innerText = totalScore + "점";
  document.getElementById('gamesPlayed').innerText = gamesPlayed + "회";

  // 서버로 점수 전송
  fetch('http://localhost:3000/update-score', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user_id: userId, score: points })
  })
  .then(res => res.json())
  .then(data => {
    if(data.success){
      console.log("DB 업데이트 완료, 현재 누적점수:", data.newScore);
    }
  })
  .catch(err => {
    console.error('점수 업데이트 실패:', err);
  });

  document.getElementById('displayPred').innerText = prediction.toFixed(1);
  document.getElementById('displayActual').innerText = actual.toFixed(1);
  document.getElementById('displayError').innerText = errorRate.toFixed(1);
  document.getElementById('displayPoints').innerText = points;

  const maxVal = Math.max(prediction, actual);
  document.getElementById('barPred').style.height = (prediction / maxVal * 200) + "px";
  document.getElementById('barActual').style.height = (actual / maxVal * 200) + "px";

  let msg = errorRate <= 5 ? "완벽합니다! 🎉" : errorRate <= 15 ? "좋습니다! 👍" : "더 노력해보세요! 💪";
  document.getElementById('resultMessage').innerText = msg;

  document.getElementById('inputCard').style.display = "none";
  document.getElementById('resultCard').style.display = "block";
}

function resetGame(){
  document.getElementById('resultCard').style.display = "none";
  document.getElementById('inputCard').style.display = "block";
  document.getElementById('prediction').value = 50;
  document.getElementById('hint').innerText = "🔒 힌트를 보려면 클릭하세요!";
  
  // 선택 초기화하지 않고 현재 선택 유지
  hintPowerData = null;
  actualPowerData = null;
}
</script>
</body>
</html>
