<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>전력 상식 퀴즈</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; padding: 24px; background:#f7f9fc; color:#111; }
    .container { max-width:720px; margin:0 auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 6px 18px rgba(20,30,50,0.08); }
    h1 { margin:0 0 12px; font-size:20px; }
    .meta { display:flex; justify-content:space-between; margin-bottom:12px; color:#555; font-size:14px; }
    .question { font-size:18px; margin:14px 0; }
    .choices { display:grid; gap:8px; }
    button.choice { padding:10px 12px; border-radius:6px; border:1px solid #d6dde6; background:#fff; cursor:pointer; text-align:left; }
    button.choice:hover { background:#f2f6fb; }
    button.choice[disabled] { opacity:0.7; cursor:default; }
    .result { margin-top:12px; padding:12px; border-radius:6px; font-weight:600; display:none; }
    .correct { background:#e6fbef; border:1px solid #b6f0c9; color:#046a2b; display:block; }
    .wrong { background:#fff1f1; border:1px solid #f2b6b6; color:#8a1616; display:block; }
    .explain { margin-top:8px; font-weight:400; color:#222; }
    .controls { margin-top:14px; display:flex; gap:8px; }
    .btn { padding:8px 12px; border-radius:6px; border:none; cursor:pointer; background:#0366d6; color:#fff; }
    .btn.secondary { background:#6c757d; }
    .score { font-weight:700; }
    .end { text-align:center; padding:18px 8px; }
    .selector { display:flex; gap:8px; margin-bottom:14px; align-items:center; }
    .diff-btn { padding:8px 12px; border-radius:6px; border:1px solid #d6dde6; background:#fff; cursor:pointer; }
    .diff-btn.active { background:#0366d6; color:#fff; border-color:#024a9a; }
    .start-wrap { text-align:center; margin-bottom:12px; }
    .cooldown { margin-top:8px; color:#666; font-size:13px; }
  </style>
</head>
<body>
  <div class="container" role="main">
    <h1>전력 상식 퀴즈</h1>

    <div id="setup">
      <div style="margin-bottom:8px">도전할 난이도를 선택하세요.</div>
      <div class="selector" role="radiogroup" aria-label="난이도 선택">
        <button class="diff-btn" data-diff="easy" id="btn-easy">쉬움</button>
        <button class="diff-btn" data-diff="normal" id="btn-normal">보통</button>
        <button class="diff-btn" data-diff="hard" id="btn-hard">어려움</button>
        <div style="margin-left:auto; color:#666; font-size:13px;">문제 수: 5</div>
      </div>
      <div class="start-wrap">
        <button id="startBtn" class="btn">시작</button>
        <div id="remaining" class="cooldown" aria-live="polite"></div>
      </div>
    </div>

    <div id="quiz" style="display:none">
      <div class="meta">
        <div id="progress">문제 1 / 1</div>
        <div class="score">점수: <span id="score">0</span></div>
      </div>

      <div class="question" id="question"></div>
      <div class="choices" id="choices"></div>
      <div id="feedback" class="result" aria-live="polite"></div>
      <div class="explain" id="explain"></div>
      <div class="controls">
        <button id="nextBtn" class="btn secondary" style="display:none">다음 문제</button>
        <button id="restartBtn" class="btn" style="display:none">처음부터</button>
      </div>
    </div>

    <div id="end" class="end" style="display:none">
      <div style="font-size:18px; margin-bottom:8px">퀴즈 완료!</div>
      <div style="margin-bottom:8px">최종 점수: <span id="finalScore"></span> / <span id="totalQ"></span></div>
      <button id="restartBtn2" class="btn">다시 풀기</button>
    </div>
  </div>

  <script>
    const bank = [
      // 쉬움
      { q: "전력 소비량을 나타내는 단위 'kWh'는 무엇을 의미하나요?", choices: ["전기의 순간 전력","1시간 동안 사용한 전력의 양","전압의 단위","전류의 단위"], correct:1, explain:"kWh는 킬로와트시로, 예: 1kW 기기를 1시간 사용하면 1kWh의 에너지를 소비합니다.", difficulty:"easy" },
      { q: "전력의 단위 'W'는 무엇의 약자인가요?", choices: ["와트 - 전력","볼트 - 전압","암페어 - 전류","줄 - 에너지"], correct:0, explain:"W(와트)는 전력의 단위로, 에너지(J)를 시간(s)으로 나눈 값입니다.", difficulty:"easy" },
      { q: "전기 안전을 위해 가장 먼저 해야 할 일은?", choices: ["젖은 손으로 전기 기기 만지기","차단기를 내리고 전원을 차단","전선을 모두 분해","전원 코드를 강제로 뽑기"], correct:1, explain:"문제가 발생하면 우선 차단기를 내려 전원을 차단하고 안전을 확보해야 합니다.", difficulty:"easy" },
      { q: "LED 전구의 장점으로 옳은 것은?", choices: ["발열이 크다","에너지 효율이 높고 수명이 김","전력 소비가 가장 높다","교체 주기가 짧다"], correct:1, explain:"LED는 전력 소비가 적고 수명이 길어 효율적입니다.", difficulty:"easy" },
      { q: "가정용 전압(한국)은 대략 몇 V인가요?", choices: ["110V","220V","380V","12V"], correct:1, explain:"한국의 가정용 표준 전압은 220V입니다.", difficulty:"easy" },

      // 보통
      { q: "발전소에서 생산된 전력은 높은 전압으로 보내지는 이유는?", choices: ["전력 손실을 줄이기 위해","전압을 높이면 전기가 더 안전해서","전압을 높이면 전류가 늘어나서","전압을 높이면 전기가 더 빠르게 흐르기 때문에"], correct:0, explain:"송전 손실은 I²R에 비례하므로 전류를 줄이기 위해 전압을 높여 전력을 보냅니다.", difficulty:"normal" },
      { q: "변압기(트랜스포머)의 주된 역할은?", choices: ["전류를 생성","전압을 바꿔 송전과 배전을 용이하게 함","전력을 저장","교류를 직류로 변환"], correct:1, explain:"변압기는 전압을 올리거나 내려 송전 손실을 줄이거나 가정용 전압으로 변환합니다.", difficulty:"normal" },
      { q: "태양광 패널의 출력은 주로 어떤 조건에 영향을 받나요?", choices: ["빛의 세기와 패널 온도","설치 각도만","배터리 용량만","지역의 전선 굵기"], correct:0, explain:"일사량, 온도, 패널 각도 등이 출력에 큰 영향을 줍니다.", difficulty:"normal" },
      { q: "스마트 미터의 주요 장점은 무엇인가요?", choices: ["원격으로 전력 사용량을 측정하고 요금/관리를 개선","전기를 더 많이 생산","배터리 수명을 늘림","전압을 자동으로 높임"], correct:0, explain:"스마트 미터는 실시간 사용량 전송으로 요금제 및 효율 관리에 도움을 줍니다.", difficulty:"normal" },
      { q: "ESS(Energy Storage System)의 일반적인 쓰임은?", choices: ["전력 저장을 통한 피크 절감 및 계통 보조","항상 전압을 낮춤","전선을 대체","전력을 소비"], correct:0, explain:"ESS는 저장된 전력을 이용해 피크를 완화하고 계통을 보조합니다.", difficulty:"normal" },

      // 어려움
      { q: "역률(Power Factor)은 무엇을 의미하나요?", choices: ["유효전력과 피상전력의 비","전압과 전류의 곱","전력 손실량","배터리 충전비율"], correct:0, explain:"역률은 유효전력(P) ÷ 피상전력(S)으로, 1에 가까우면 효율적입니다.", difficulty:"hard" },
      { q: "무효전력(reactive power)이 전력계통에 주는 영향은?", choices: ["전압 조절 및 전력 전달에 영향","에너지를 영구히 소비","전류를 항상 줄인다","송전로를 보호한다"], correct:0, explain:"무효전력은 전압 유지와 전력 흐름에 영향을 주며 보상 필요성이 있습니다.", difficulty:"hard" },
      { q: "스피닝 리저브(spinning reserve)의 역할은?", choices: ["급작스런 수요 증가에 즉시 대응 가능한 예비력 제공","발전 비용을 줄이는 제도","항상 충전되는 배터리","송전 손실을 증가시키는 장치"], correct:0, explain:"스피닝 리저브는 가동 중인 발전기가 즉시 출력을 늘려 불시 상황에 대응합니다.", difficulty:"hard" },
      { q: "HVDC(고압 직류 송전)의 장점은?", choices: ["장거리 송전에 전력 손실이 적고 안정적","항상 저렴하다","교류보다 변압이 쉬움","직류는 주파수가 있다"], correct:0, explain:"HVDC는 장거리 및 해저 송전에서 손실과 동기 문제를 줄여 유리합니다.", difficulty:"hard" },
      { q: "무효전력 보상을 위해 주로 쓰이는 장치는?", choices: ["콘덴서 뱅크(Capacitor bank)","발전기의 로터","송전탑","차단기"], correct:0, explain:"콘덴서 뱅크는 무효전력을 보상해 역률을 개선합니다.", difficulty:"hard" }
    ];

    const QUESTIONS_PER_SESSION = 5;
    const POINTS = { easy:10, normal:15, hard:20 };

    // 쿨다운 설정: 6시간
    const COOLDOWN_MS = 6 * 60 * 60 * 1000;
    const COOLDOWN_KEY = 'quizCooldown_ts';

    let selectedDifficulty = null;
    let POINTS_PER_CORRECT = POINTS.normal;
    let currentQuestions = [];
    let idx = 0;
    let score = 0;

    const setupEl = document.getElementById('setup');
    const quizEl = document.getElementById('quiz');
    const endEl = document.getElementById('end');
    const questionEl = document.getElementById('question');
    const choicesEl = document.getElementById('choices');
    const progressEl = document.getElementById('progress');
    const scoreEl = document.getElementById('score');
    const feedbackEl = document.getElementById('feedback');
    const explainEl = document.getElementById('explain');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const startBtn = document.getElementById('startBtn');
    const diffBtns = document.querySelectorAll('.diff-btn');
    const remainingEl = document.getElementById('remaining');

    function shuffleArray(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getCooldownRemaining() {
      const ts = Number(localStorage.getItem(COOLDOWN_KEY) || 0);
      if (!ts) return 0;
      const rem = ts + COOLDOWN_MS - Date.now();
      return rem > 0 ? rem : 0;
    }
    function formatMs(ms) {
      const s = Math.floor(ms/1000);
      const h = Math.floor(s/3600);
      const m = Math.floor((s%3600)/60);
      const sec = s%60;
      return `${h}시간 ${m}분 ${sec}초`;
    }
    function updateCooldownUI() {
      const rem = getCooldownRemaining();
      if (rem > 0) {
        startBtn.disabled = true;
        remainingEl.textContent = `다시 도전 가능까지: ${formatMs(rem)}`;
      } else {
        startBtn.disabled = false;
        remainingEl.textContent = '지금 도전 가능';
      }
    }
    function setCooldownNow() {
      localStorage.setItem(COOLDOWN_KEY, Date.now().toString());
      updateCooldownUI();
    }

    diffBtns.forEach(b => b.addEventListener('click', () => {
      diffBtns.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      selectedDifficulty = b.dataset.diff;
    }));

    function prepareQuiz() {
      if (!selectedDifficulty) selectedDifficulty = 'normal';
      POINTS_PER_CORRECT = POINTS[selectedDifficulty];

      let pool = bank.filter(x => x.difficulty === selectedDifficulty).slice();
      if (pool.length < QUESTIONS_PER_SESSION) {
        const others = bank.filter(x => x.difficulty !== selectedDifficulty);
        pool = pool.concat(others);
      }

      shuffleArray(pool);
      const picked = pool.slice(0, Math.min(QUESTIONS_PER_SESSION, pool.length));

      currentQuestions = picked.map(q => {
        const mapped = q.choices.map((c,i) => ({ text:c, orig:i }));
        shuffleArray(mapped);
        const newChoices = mapped.map(x => x.text);
        const newCorrect = mapped.findIndex(x => x.orig === q.correct);
        return { q: q.q, choices: newChoices, correct: newCorrect, explain: q.explain };
      });

      idx = 0;
      score = 0;
      scoreEl.textContent = score;
    }

    function renderQuestion() {
      const item = currentQuestions[idx];
      progressEl.textContent = `문제 ${idx+1} / ${currentQuestions.length}`;
      questionEl.textContent = item.q;
      choicesEl.innerHTML = '';
      feedbackEl.style.display = 'none';
      explainEl.textContent = '';
      nextBtn.style.display = 'none';
      restartBtn.style.display = 'none';

      item.choices.forEach((c,i) => {
        const b = document.createElement('button');
        b.className = 'choice';
        b.type = 'button';
        b.textContent = c;
        b.dataset.index = i;
        b.addEventListener('click', onChoice);
        choicesEl.appendChild(b);
      });
    }

    function onChoice(e) {
      const selected = Number(e.currentTarget.dataset.index);
      const item = currentQuestions[idx];
      Array.from(choicesEl.children).forEach(b => b.disabled = true);

      if (selected === item.correct) {
        feedbackEl.className = 'result correct';
        feedbackEl.textContent = '정답입니다';
        score += POINTS_PER_CORRECT;
        scoreEl.textContent = score;
      } else {
        feedbackEl.className = 'result wrong';
        feedbackEl.textContent = '오답입니다';
      }
      feedbackEl.style.display = 'block';
      explainEl.textContent = item.explain;

      if (idx < currentQuestions.length - 1) {
        nextBtn.style.display = 'inline-block';
      } else {
        setCooldownNow();
        restartBtn.style.display = 'inline-block';
        setTimeout(() => showEnd(), 700);
      }
    }

    function showEnd() {
      quizEl.style.display = 'none';
      endEl.style.display = 'block';
      document.getElementById('finalScore').textContent = score;
      document.getElementById('totalQ').textContent = (currentQuestions.length * POINTS_PER_CORRECT);
    }

    nextBtn.addEventListener('click', () => {
      idx++;
      renderQuestion();
    });

    function resetToSetup() {
      endEl.style.display = 'none';
      quizEl.style.display = 'none';
      setupEl.style.display = 'block';
      diffBtns.forEach(x => x.classList.remove('active'));
      selectedDifficulty = null;
      scoreEl.textContent = 0;
      updateCooldownUI();
    }

    restartBtn.addEventListener('click', resetToSetup);
    document.getElementById('restartBtn2').addEventListener('click', resetToSetup);

    startBtn.addEventListener('click', () => {
      if (getCooldownRemaining() > 0) {
        updateCooldownUI();
        return;
      }
      if (!selectedDifficulty) selectedDifficulty = 'normal';
      prepareQuiz();
      setupEl.style.display = 'none';
      endEl.style.display = 'none';
      quizEl.style.display = 'block';
      renderQuestion();
    });

    resetToSetup();
    updateCooldownUI();
    setInterval(updateCooldownUI, 1000);
  </script>
</body>
</html>
