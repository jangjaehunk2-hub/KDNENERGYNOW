<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 / 회원가입</title>

<!-- Boxicons (사이드바 아이콘용) -->
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

<style>
/* ===== 전체 레이아웃 ===== */
body {
  font-family: 'Arial', sans-serif;
  background: #f5f5f5;
  margin: 0;
  display: flex;
  height: 100vh;
}

/* ===== 사이드바 ===== */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 140px;
  height: 100vh;
  background-color: #1a1a1a;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-y: auto;
  z-index: 1000;
}
.sidebar-button {
  width: 100%;
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  border: none;
  background: transparent;
  color: white;
  cursor: pointer;
  transition: all 0.2s;
}
.sidebar-button:hover {
  background-color: rgba(255, 255, 255, 0.1);
}
.sidebar-button.active {
  background-color: rgba(255, 255, 255, 0.1);
  border-left: 4px solid #0066ff;
}
.sidebar-button i {
  font-size: 24px;
}
.sidebar-button span {
  font-size: 14px;
}

/* ===== 메인 컨텐츠 영역 ===== */
.main-content {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  margin-left: 140px;
}

/* ===== 카드 박스 ===== */
.card {
  background: white;
  padding: 40px 50px;
  border-radius: 20px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  width: 100%;
  max-width: 400px;
  text-align: center;
  transition: 0.3s;
}
.card:hover {
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

/* ===== 제목 ===== */
.card h1 {
  color: #2563eb;
  margin-bottom: 10px;
}
.card p {
  color: #555;
  margin-bottom: 30px;
}

/* ===== 폼 ===== */
.form-group {
  text-align: left;
  margin-bottom: 20px;
}
.form-group label {
  font-size: 14px;
  color: #333;
  display: block;
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 15px;
  box-sizing: border-box;
  transition: 0.2s;
}
.form-group input:focus {
  border-color: #2563eb;
  outline: none;
}

/* ===== 버튼 ===== */
button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
.login-button {
  background-color: #2563eb;
  color: white;
}
.login-button:hover {
  background-color: #1d4ed8;
}
.signup-button {
  background-color: #e5e7eb;
  color: #333;
  margin-top: 10px;
}
.signup-button:hover {
  background-color: #d1d5db;
}

/* ===== 폼 전환 애니메이션 ===== */
.hidden {
  display: none;
}
</style>
</head>

<body>
<!-- ===== 사이드바 ===== -->
<aside class="sidebar">
  <button class="sidebar-button" data-tab="map" onclick="window.location.href='index.html'">
      <i class='bx bx-map'></i><span>Map</span>
  </button>
  <button class="sidebar-button" data-tab="slide" onclick="window.location.href='slide.html'">
      <i class='bx bx-slider'></i><span>Slide</span>
  </button>
  <button class="sidebar-button" data-tab="game" onclick="window.location.href='gameplatform.html'">
      <i class='bx bx-game'></i><span>Game</span>
  </button>
  <button class="sidebar-button" data-tab="education" onclick="window.location.href='education.html'">
      <i class='bx bx-book-reader'></i><span>Education</span>
  </button>
  <button class="sidebar-button active" data-tab="login" onclick="window.location.href='login.html'">
      <i class='bx bx-log-in'></i><span>Login</span>
  </button>
</aside>

<!-- ===== 메인 로그인/회원가입 카드 ===== -->
<div class="main-content">
  <div class="card">

    <!-- 로그인 폼 -->
    <div id="loginForm">
      <h1>로그인</h1>
      <p>계정에 로그인하세요</p>
      <form>
        <div class="form-group">
          <label for="email">이메일</label>
          <input type="email" id="email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="login-button">로그인</button>
      </form>
      <button class="signup-button" onclick="toggleForm()">회원가입</button>
    </div>

    <!-- 회원가입 폼 -->
    <div id="signupForm" class="hidden">
    <h1>회원가입</h1>
    <p>새 계정을 만들어주세요</p>
    <form id="signupFormElement">
        <div class="form-group">
        <label for="signup-id">아이디</label>
        <input type="text" id="signup-id" placeholder="아이디 입력" required>
        </div>
        <div class="form-group">
        <label for="signup-nick">닉네임</label>
        <input type="text" id="signup-nick" placeholder="닉네임 입력" required>
        </div>
        <div class="form-group">
        <label for="signup-email">이메일</label>
        <input type="email" id="signup-email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
        <label for="signup-password">비밀번호</label>
        <input type="password" id="signup-password" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="login-button">회원가입 완료</button>
    </form>
    <button class="signup-button" onclick="toggleForm()">← 로그인으로 돌아가기</button>
    </div>

    <!-- 로그아웃 폼 -->
    <div id="logoutForm" class="hidden">
      <h1>로그아웃</h1>
      <p id="logoutMessage"></p>
      <button class="login-button" onclick="showEditProfile()">정보 수정</button>
      <button class="login-button" onclick="logout()" style="margin-top: 10px;">로그아웃</button>
      <button class="signup-button" onclick="cancelLogout()">취소</button>
    </div>

    <!-- 정보 수정 폼 -->
    <div id="editProfileForm" class="hidden">
      <h1>정보 수정</h1>
      <p id="editProfileMessage"></p>
      <form id="editProfileFormElement">
        <div class="form-group">
          <label for="edit-nick">닉네임</label>
          <input type="text" id="edit-nick" placeholder="새 닉네임 입력" required>
        </div>
        <div class="form-group">
          <label for="edit-email">이메일</label>
          <input type="email" id="edit-email" placeholder="새 이메일 입력" required>
        </div>
        <div class="form-group">
          <label for="edit-password">새 비밀번호 (선택사항)</label>
          <input type="password" id="edit-password" placeholder="변경할 비밀번호 입력">
        </div>
        <div class="form-group">
          <label for="current-password">현재 비밀번호 (확인용)</label>
          <input type="password" id="current-password" placeholder="현재 비밀번호 입력" required>
        </div>
        <button type="submit" class="login-button">수정 완료</button>
      </form>
      <button class="signup-button" onclick="cancelEdit()">← 뒤로 가기</button>
    </div>

  </div>
</div>

<script>
    // ✅ sessionStorage만 사용
    let isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';

    // 로그인 폼
    document.querySelector('#loginForm form').addEventListener('submit', function(e){
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        fetch('http://localhost:3000/login', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ email, password })
        })
        .then(res => res.json())
        .then(result => {
            if(result.success){
                alert(result.message + `\n환영합니다, ${result.user.nick_name}님!`);
                
                // sessionStorage에 사용자 정보 저장
                const userData = {
                    user_id: result.user.user_id,
                    nick_name: result.user.nick_name,
                    email: result.user.email,
                    score: result.user.score,
                    admin_flag: result.user.admin_flag
                };
                sessionStorage.setItem('user', JSON.stringify(userData));
                sessionStorage.setItem('isLoggedIn', 'true');
                
                console.log('✅ 로그인 성공 - sessionStorage에 저장:', userData);
                
                window.location.href = 'gameplatform.html'; // ✅ calendar.html로 이동
            } else {
                alert(result.message);
            }
        })
        .catch(err => {
            console.error(err);
            alert('로그인 중 오류가 발생했습니다.');
        });
    });

    // 회원가입 폼
    document.getElementById('signupFormElement').addEventListener('submit', function(e){
        e.preventDefault();
        const userId = document.getElementById('signup-id').value;
        const nickName = document.getElementById('signup-nick').value;
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;

        fetch('http://localhost:3000/signup', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ user_id: userId, nick_name: nickName, email, password })
        })
        .then(res => res.json())
        .then(result => {
            if(result.success){
                alert(result.message || '회원가입 완료!');
                toggleForm();
            } else {
                alert(result.message || '회원가입에 실패했습니다.');
            }
        })
        .catch(err => {
            console.error(err);
            alert('회원가입 중 오류가 발생했습니다.');
        });
    });

    // 로그인 ↔ 회원가입 폼 전환
    function toggleForm() {
        document.getElementById('loginForm').classList.toggle('hidden');
        document.getElementById('signupForm').classList.toggle('hidden');
    }

    // 게임 버튼 클릭 시 로그인 체크
    document.querySelector('.sidebar-button[data-tab="game"]')?.addEventListener('click', (e) => {
        const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
        if(!isLoggedIn){
            e.preventDefault();
            alert('게임을 이용하려면 먼저 로그인해야 합니다.');
            window.location.href = 'login.html';
        }
    });

    // ✅ 페이지 로드 시 로그인 상태 확인 (sessionStorage 사용)
    document.addEventListener('DOMContentLoaded', () => {
      const userData = sessionStorage.getItem('user');
      const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
      
      if (isLoggedIn && userData) {
        const user = JSON.parse(userData);
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('signupForm').classList.add('hidden');
        document.getElementById('logoutForm').classList.remove('hidden');
        document.getElementById('logoutMessage').textContent = `${user.nick_name || '사용자'}님, 로그인 상태입니다.`;
      }
    });

    // ✅ 로그아웃 함수 (sessionStorage 사용)
    function logout() {
      sessionStorage.removeItem('isLoggedIn');
      sessionStorage.removeItem('user');
      alert('로그아웃되었습니다.');
      window.location.href = 'index.html';
    }

    // ✅ 로그아웃 취소
    function cancelLogout() {
      window.location.href = 'gameplatform.html';
    }

    // ✅ 정보 수정 화면 표시
    function showEditProfile() {
      const userData = sessionStorage.getItem('user');
      if (!userData) {
        alert('로그인 정보를 찾을 수 없습니다.');
        return;
      }
      
      const user = JSON.parse(userData);
      document.getElementById('edit-nick').value = user.nick_name || '';
      document.getElementById('edit-email').value = user.email || '';
      document.getElementById('editProfileMessage').textContent = `${user.nick_name || '사용자'}님의 정보를 수정합니다.`;
      
      document.getElementById('logoutForm').classList.add('hidden');
      document.getElementById('editProfileForm').classList.remove('hidden');
    }

    // ✅ 정보 수정 취소
    function cancelEdit() {
      document.getElementById('editProfileForm').classList.add('hidden');
      document.getElementById('logoutForm').classList.remove('hidden');
      // 입력 필드 초기화
      document.getElementById('edit-password').value = '';
      document.getElementById('current-password').value = '';
    }

    // ✅ 정보 수정 폼 제출
    document.getElementById('editProfileFormElement')?.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const userData = sessionStorage.getItem('user');
      if (!userData) {
        alert('로그인 정보를 찾을 수 없습니다.');
        return;
      }
      
      const user = JSON.parse(userData);
      const nickName = document.getElementById('edit-nick').value;
      const email = document.getElementById('edit-email').value;
      const newPassword = document.getElementById('edit-password').value;
      const currentPassword = document.getElementById('current-password').value;
      
      const updateData = {
        user_id: user.user_id,
        nick_name: nickName,
        email: email,
        current_password: currentPassword
      };
      
      // 새 비밀번호가 입력된 경우에만 추가
      if (newPassword) {
        updateData.new_password = newPassword;
      }
      
      fetch('http://localhost:3000/update-profile', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(updateData)
      })
      .then(res => res.json())
      .then(result => {
        if (result.success) {
          alert(result.message || '정보가 성공적으로 수정되었습니다.');
          
          // sessionStorage 업데이트
          const updatedUser = {
            ...user,
            nick_name: nickName,
            email: email
          };
          sessionStorage.setItem('user', JSON.stringify(updatedUser));
          
          // 로그아웃 화면으로 돌아가기
          document.getElementById('editProfileForm').classList.add('hidden');
          document.getElementById('logoutForm').classList.remove('hidden');
          document.getElementById('logoutMessage').textContent = `${nickName}님, 로그인 상태입니다.`;
          
          // 입력 필드 초기화
          document.getElementById('edit-password').value = '';
          document.getElementById('current-password').value = '';
        } else {
          alert(result.message || '정보 수정에 실패했습니다.');
        }
      })
      .catch(err => {
        console.error(err);
        alert('정보 수정 중 오류가 발생했습니다.');
      });
    });
</script>
</body>
</html>
