    <script>
        let allPowerPlants = [];
        let currentFilter = 'all';
        let selectedPlant = null;
        let currentChart = null;
        let currentPlantData = null;
        let availableYears = [];
        let globalYAxisMin = 0;
        let globalYAxisMax = 0;

        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const powerDataContainer = document.getElementById('powerDataContainer');
        const powerDataContent = document.getElementById('powerDataContent');
        const selectedPlantName = document.getElementById('selectedPlantName');
        const resetButton = document.getElementById('resetButton');

        const iconEmoji = {
            '수력': '💧',
            '원자력': '☢️',
            '풍력': '💨',
            '태양광': '☀️',
            '화력': '🔥'
        };

        async function fetchAllPlants() {
            try {
                const response = await fetch('http://localhost:3000/api/plants');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const responseData = await response.json();
                
                let data = [];
                if (responseData.plants && Array.isArray(responseData.plants)) {
                    data = responseData.plants;
                } else if (Array.isArray(responseData)) {
                    data = responseData;
                } else {
                    throw new Error('잘못된 응답 형식');
                }
                
                return data.map((plant, index) => {
                    const plantType = plant.plant_type || '알 수 없음';
                    
                    let type = '화력';
                    const typeStr = String(plantType).toLowerCase();
                    
                    if (typeStr.includes('수력') || typeStr === 'hydro') {
                        type = '수력';
                    } else if (typeStr.includes('원자력') || typeStr === 'nuclear') {
                        type = '원자력';
                    } else if (typeStr.includes('풍력') || typeStr === 'wind') {
                        type = '풍력';
                    } else if (typeStr.includes('태양광') || typeStr === 'solar') {
                        type = '태양광';
                    } else if (typeStr.includes('화력') || typeStr === 'thermal') {
                        type = '화력';
                    }
                    
                    return {
                        id: `${type}_${index}`,
                        name: plant.plant_name || '이름 없음',
                        type: type,
                        operator: plant.business || '정보 없음',
                        unit: plant.remark || '',
                        location: plant.adress || '위치 정보 없음',
                        latitude: parseFloat(plant.latitude),
                        longitude: parseFloat(plant.longitude),
                        capacity: parseFloat(plant.capacity) || 100,
                        installYear: parseInt(plant.install_year) || 2014
                    };
                });
            } catch (error) {
                console.error('❌ 발전소 데이터 로드 실패:', error);
                return [];
            }
        }

        async function loadAllPlants() {
            allPowerPlants = await fetchAllPlants();
            displaySearchResults(allPowerPlants);
        }

        function displaySearchResults(plants) {
            if (plants.length === 0) {
                searchResults.innerHTML = '<div class="no-results">검색 결과가 없습니다</div>';
                searchResults.classList.add('active');
                return;
            }

            const html = plants.map(plant => `
                <div class="search-result-item" data-plant-id="${plant.id}">
                    <div class="result-left">
                        <div class="result-name">${plant.name}</div>
                        <div class="result-info">
                            <div class="result-type">
                                <span>${iconEmoji[plant.type]}</span>
                                <span>${plant.type}</span>
                            </div>
                            <div class="result-detail">
                                <span class="result-capacity">${plant.capacity} MW</span>
                            </div>
                            <div class="result-detail">
                                <span>📍</span>
                                <span>${plant.location}</span>
                            </div>
                            <div class="result-detail">
                                <span>🏢</span>
                                <span>${plant.operator}</span>
                            </div>
                            <div class="result-detail">
                                <span>📅</span>
                                <span>${plant.installYear}년 설치</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            searchResults.innerHTML = html;
            searchResults.classList.add('active');

            document.querySelectorAll('.search-result-item').forEach(item => {
                item.addEventListener('click', async function() {
                    const plantId = this.dataset.plantId;
                    const plant = allPowerPlants.find(p => p.id === plantId);
                    if (plant) {
                        selectedPlant = plant;
                        searchInput.value = plant.name;
                        await displayPowerData(plant);
                        powerDataContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            });
        }

        function formatUnitName(unitName) {
            const match = unitName.match(/#(\d+)/);
            if (match) {
                return match[1] + '호기';
            }
            return unitName;
        }

        function calculateGlobalYAxisRange(powerData) {
            let allValues = [];
            Object.values(powerData).forEach(unitData => {
                if (Array.isArray(unitData)) {
                    unitData.forEach(item => {
                        if (item.value && item.value > 0) {
                            allValues.push(item.value);
                        }
                    });
                }
            });
            
            if (allValues.length === 0) {
                return { min: 0, max: 100 };
            }
            
            const maxValue = Math.max(...allValues);
            const minValue = Math.min(...allValues);
            
            function getNiceMax(max) {
                if (max === 0) return 100;
                const magnitude = Math.pow(10, Math.floor(Math.log10(max)));
                const normalized = max / magnitude;
                let niceValue;
                if (normalized <= 1) niceValue = 1;
                else if (normalized <= 2) niceValue = 2;
                else if (normalized <= 5) niceValue = 5;
                else niceValue = 10;
                return niceValue * magnitude * 1.1;
            }
            
            function getNiceMin(min, max) {
                if (min === 0 || min >= max * 0.5) return 0;
                const magnitude = Math.pow(10, Math.floor(Math.log10(min)));
                const normalized = min / magnitude;
                let niceValue;
                if (normalized >= 5) niceValue = 5;
                else if (normalized >= 2) niceValue = 2;
                else if (normalized >= 1) niceValue = 1;
                else niceValue = 0.5;
                return niceValue * magnitude * 0.9;
            }
            
            const yAxisMax = getNiceMax(maxValue);
            const yAxisMin = getNiceMin(minValue, maxValue);
            
            return { min: yAxisMin, max: yAxisMax };
        }

        function createPowerLineChart(canvasId, powerData, selectedUnit, plantName, maxYearIndex) {
            if (currentChart) {
                currentChart.destroy();
                currentChart = null;
            }

            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            
            // 선택된 호기의 연도별 데이터 가져오기
            const unitData = powerData[selectedUnit] || [];
            const sortedData = unitData.sort((a, b) => a.year - b.year);
            
            // maxYearIndex까지만 데이터 표시
            const filteredData = sortedData.slice(0, maxYearIndex + 1);
            
            const years = filteredData.map(d => d.year + '년');
            const values = filteredData.map(d => d.value);

            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: years,
                    datasets: [{
                        label: `${formatUnitName(selectedUnit)} 발전량 (MWh)`,
                        data: values,
                        backgroundColor: 'rgba(255, 51, 102, 0.1)',
                        borderColor: '#ff3366',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        pointBackgroundColor: '#ff3366',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: '#ff3366',
                        pointHoverBorderWidth: 3,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                font: { size: 14, weight: 'bold' },
                                padding: 15
                            }
                        },
                        title: {
                            display: true,
                            text: `${plantName} - ${formatUnitName(selectedUnit)} 연도별 발전량`,
                            font: { size: 18, weight: 'bold' },
                            padding: { top: 10, bottom: 20 }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            padding: 12,
                            titleFont: { size: 14 },
                            bodyFont: { size: 13 },
                            callbacks: {
                                label: function(context) {
                                    return '발전량: ' + context.parsed.y.toLocaleString() + ' MWh';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: globalYAxisMin === 0,
                            min: globalYAxisMin,
                            max: globalYAxisMax,
                            ticks: {
                                callback: function(value) {
                                    return value.toLocaleString() + ' MWh';
                                },
                                font: { size: 12 }
                            },
                            grid: { color: 'rgba(0, 0, 0, 0.05)' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: {
                                font: { size: 12, weight: 'bold' }
                            }
                        }
                    }
                }
            });
        }

        function createYearMarkers(minYear, maxYear) {
            const container = document.getElementById('yearMarkers');
            if (!container) return;
            
            container.innerHTML = '';
            const totalYears = maxYear - minYear;
            
            for (let i = 0; i <= totalYears; i++) {
                const year = minYear + i;
                const percentage = (i / totalYears) * 100;
                
                const marker = document.createElement('div');
                marker.className = 'year-marker';
                marker.style.left = percentage + '%';
                marker.innerHTML = `
                    <div class="year-marker-line"></div>
                    <div class="year-marker-label">${year}</div>
                `;
                container.appendChild(marker);
            }
        }

        function createUnitSelector(powerData) {
            const units = Object.keys(powerData).sort((a, b) => {
                const numA = parseInt(a.match(/\d+/)?.[0] || 0);
                const numB = parseInt(b.match(/\d+/)?.[0] || 0);
                return numA - numB;
            });
            
            const options = units.map(unit => 
                `<option value="${unit}">${formatUnitName(unit)}</option>`
            ).join('');
            
            return `
                <div class="unit-selector-container">
                    <label class="unit-selector-label">호기 선택</label>
                    <select class="unit-selector" id="unitSelector">
                        ${options}
                    </select>
                </div>
            `;
        }

        async function displayPowerData(plant) {
            selectedPlantName.textContent = plant.name;
            powerDataContent.innerHTML = '<div class="loading-power">발전량 데이터를 불러오는 중...</div>';
            powerDataContainer.classList.add('active');
            
            // 지도 컨테이너 생성 (접을 수 있는 형태)
            const mapHTML = `
                <div class="map-detail-section">
                    <div class="map-detail-header" id="mapDetailHeader">
                        <div class="map-detail-title">
                            <span>📍</span>
                            <span>발전소 위치</span>
                        </div>
                        <div class="map-detail-toggle" id="mapDetailToggle">
                            <i class='bx bx-chevron-down'></i>
                        </div>
                    </div>
                    <div class="map-detail-content" id="mapDetailContent">
                        <div class="map-detail-inner">
                            <div id="plant-map" style="width: 100%; height: 300px; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px;"></div>
                            <div style="padding: 12px; background: #f8f9fa; border-radius: 8px; font-size: 14px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                                    <span style="color: #666; font-weight: 500;">위치:</span>
                                    <span style="font-weight: 600; color: #333;">${plant.location}</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                                    <span style="color: #666; font-weight: 500;">운영기관:</span>
                                    <span style="font-weight: 600; color: #333;">${plant.operator}</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                                    <span style="color: #666; font-weight: 500;">설치용량:</span>
                                    <span style="font-weight: 600; color: #0066ff;">${plant.capacity} MW</span>
                                </div>
                                <div style="display: flex; justify-content: space-between;">
                                    <span style="color: #666; font-weight: 500;">설치년도:</span>
                                    <span style="font-weight: 600; color: #333;">${plant.installYear}년</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            powerDataContent.innerHTML = mapHTML + '<div class="loading-power">발전량 데이터를 불러오는 중...</div>';
            
            // 지도 토글 이벤트
            const mapDetailHeader = document.getElementById('mapDetailHeader');
            const mapDetailContent = document.getElementById('mapDetailContent');
            const mapDetailToggle = document.getElementById('mapDetailToggle');
            
            mapDetailHeader.addEventListener('click', () => {
                const isOpen = mapDetailContent.classList.toggle('open');
                mapDetailToggle.classList.toggle('open');
                
                // 지도가 열릴 때만 초기화 (성능 최적화)
                if (isOpen && !mapDetailContent.dataset.initialized) {
                    initPlantMap(plant);
                    mapDetailContent.dataset.initialized = 'true';
                }
            });
            
            if (plant.type === '원자력') {
                try {
                    const response = await fetch('http://localhost:3000/api/nuclear/full');
                    if (!response.ok) throw new Error('데이터 조회 실패');
                    
                    const data = await response.json();
                    
                    const nuclearPlant = data.find(p => {
                        const dbName = p.plant_name || '';
                        return dbName === plant.name || dbName.includes(plant.name) || plant.name.includes(dbName);
                    });
                    
                    if (nuclearPlant && nuclearPlant.powerData && Object.keys(nuclearPlant.powerData).length > 0) {
                        currentPlantData = nuclearPlant.powerData;
                        
                        const yAxisRange = calculateGlobalYAxisRange(nuclearPlant.powerData);
                        globalYAxisMin = yAxisRange.min;
                        globalYAxisMax = yAxisRange.max;
                        
                        const yearsSet = new Set();
                        Object.values(nuclearPlant.powerData).forEach(unitData => {
                            if (Array.isArray(unitData)) {
                                unitData.forEach(item => {
                                    if (item.year) yearsSet.add(item.year);
                                });
                            }
                        });
                        availableYears = Array.from(yearsSet).sort((a, b) => a - b);
                        
                        if (availableYears.length === 0) {
                            const loadingDiv = powerDataContent.querySelector('.loading-power');
                            if (loadingDiv) {
                                loadingDiv.innerHTML = '📊 연도 데이터가 없습니다';
                            }
                            return;
                        }
                        
                        const minYear = Math.min(...availableYears);
                        const maxYear = Math.max(...availableYears);
                        const defaultYear = minYear;
                        const firstUnit = Object.keys(currentPlantData).sort((a, b) => {
                            const numA = parseInt(a.match(/\d+/)?.[0] || 0);
                            const numB = parseInt(b.match(/\d+/)?.[0] || 0);
                            return numA - numB;
                        })[0];
                        
                        let html = mapHTML + `
                            ${createUnitSelector(currentPlantData)}
                            <div class="slider-controls">
                                <div class="slider-container" style="width: 90%;">
                                    <div class="year-display" id="yearDisplay">${minYear}년</div>
                                    <div class="year-markers" id="yearMarkers"></div>
                                    <input type="range" 
                                        id="yearSlider" 
                                        min="0" 
                                        max="${availableYears.length - 1}" 
                                        value="0" 
                                        step="1" />
                                    <div class="year-range">
                                        <span>${minYear}년</span>
                                        <span>${maxYear}년</span>
                                    </div>
                                </div>
                            </div>
                            <div class="chart-container">
                                <div class="chart-wrapper">
                                    <canvas id="powerChart"></canvas>
                                </div>
                                <div id="emptyChartMessage" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #999; font-size: 18px; font-weight: 500;">
                                    <i class='bx bx-line-chart' style="font-size: 48px; margin-bottom: 10px; display: block;"></i>
                                    슬라이더를 오른쪽으로 움직여 연도별 발전량을 확인하세요
                                </div>
                            </div>
                            <div class="data-detail-section">
                                <div class="data-detail-header" id="dataDetailHeader">
                                    <div class="data-detail-title">
                                        <span>📊</span>
                                        <span>상세 데이터</span>
                                    </div>
                                    <div class="data-detail-toggle" id="dataDetailToggle">
                                        <i class='bx bx-chevron-down'></i>
                                    </div>
                                </div>
                                <div class="data-detail-content" id="dataDetailContent">
                                    <div class="data-detail-inner">
                                        <div id="dataTableContainer"></div>
                                    </div>
                                </div>
                            </div>
                        `;
                        
                        powerDataContent.innerHTML = html;
                        
                        // 지도 토글 이벤트 재등록
                        const mapDetailHeader = document.getElementById('mapDetailHeader');
                        const mapDetailContent = document.getElementById('mapDetailContent');
                        const mapDetailToggle = document.getElementById('mapDetailToggle');
                        
                        mapDetailHeader.addEventListener('click', () => {
                            const isOpen = mapDetailContent.classList.toggle('open');
                            mapDetailToggle.classList.toggle('open');
                            
                            if (isOpen && !mapDetailContent.dataset.initialized) {
                                initPlantMap(plant);
                                mapDetailContent.dataset.initialized = 'true';
                            }
                        });
                        
                        createYearMarkers(minYear, maxYear);
                        
                        const unitSelector = document.getElementById('unitSelector');
                        const yearSlider = document.getElementById('yearSlider');
                        const yearDisplay = document.getElementById('yearDisplay');
                        const dataDetailHeader = document.getElementById('dataDetailHeader');
                        const dataDetailContent = document.getElementById('dataDetailContent');
                        const dataDetailToggle = document.getElementById('dataDetailToggle');
                        
                        let currentUnit = firstUnit;
                        let currentYearIndex = 0;
                        
                        dataDetailHeader.addEventListener('click', () => {
                            dataDetailContent.classList.toggle('open');
                            dataDetailToggle.classList.toggle('open');
                        });
                        
                        // 호기 선택 이벤트
                        unitSelector.addEventListener('change', function() {
                            currentUnit = this.value;
                            currentYearIndex = parseInt(yearSlider.value);
                            
                            // 현재 슬라이더 위치에 따라 그래프 업데이트
                            const emptyMessage = document.getElementById('emptyChartMessage');
                            if (emptyMessage) {
                                emptyMessage.style.display = 'none';
                            }
                            createPowerLineChart('powerChart', currentPlantData, currentUnit, plant.name, currentYearIndex);
                            
                            updateDataTableForUnit(currentPlantData, currentUnit);
                        });
                        
                        // 연도 슬라이더 이벤트
                        yearSlider.addEventListener('input', function() {
                            const yearIndex = parseInt(this.value);
                            currentYearIndex = yearIndex;
                            const selectedYear = availableYears[yearIndex];
                            yearDisplay.textContent = selectedYear + '년';
                            
                            const emptyMessage = document.getElementById('emptyChartMessage');
                            
                            if (yearIndex === 0) {
                                // 맨 왼쪽: 첫 연도 점 하나만 표시
                                if (emptyMessage) {
                                    emptyMessage.style.display = 'none';
                                }
                                createPowerLineChart('powerChart', currentPlantData, currentUnit, plant.name, 0);
                            } else {
                                // 오른쪽으로 이동: 해당 연도까지의 그래프 표시
                                if (emptyMessage) {
                                    emptyMessage.style.display = 'none';
                                }
                                createPowerLineChart('powerChart', currentPlantData, currentUnit, plant.name, yearIndex);
                            }
                        });
                        
                        // 초기에는 첫 번째 점만 표시
                        createPowerLineChart('powerChart', currentPlantData, firstUnit, plant.name, 0);
                        updateDataTableForUnit(currentPlantData, firstUnit);
                    } else {
                        const loadingDiv = powerDataContent.querySelector('.loading-power');
                        if (loadingDiv) {
                            loadingDiv.innerHTML = '📊 이 발전소의 발전량 데이터가 없습니다';
                        }
                    }
                } catch (error) {
                    console.error('❌ 발전량 데이터 조회 실패:', error);
                    const loadingDiv = powerDataContent.querySelector('.loading-power');
                    if (loadingDiv) {
                        loadingDiv.innerHTML = '❌ 발전량 데이터 조회 실패';
                    }
                }
            } else {
                const loadingDiv = powerDataContent.querySelector('.loading-power');
                if (loadingDiv) {
                    loadingDiv.innerHTML = `📊 ${plant.type} 발전소의 발전량 데이터는 아직 준비되지 않았습니다`;
                }
            }
        }

        function initPlantMap(plant) {
            setTimeout(() => {
                const plantMap = L.map('plant-map').setView([plant.latitude, plant.longitude], 10);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }).addTo(plantMap);
                
                const colorMap = { 
                    '수력': "#00aaff",
                    '원자력': "#ff3366",
                    '풍력': "#90ee90",
                    '태양광': "#ffd700",
                    '화력': "#ff6347"
                };
                
                const color = colorMap[plant.type];
                const emoji = iconEmoji[plant.type];
                
                const icon = L.divIcon({
                    className: 'custom-marker',
                    html: `
                        <div style="position: relative; pointer-events: none; display: flex; align-items: center; justify-content: center;">
                            <div style="
                                width: 40px;
                                height: 40px;
                                background-color: white;
                                border: 3px solid ${color};
                                border-radius: 50%;
                                box-shadow: 0 4px 8px rgba(0,0,0,0.3);
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                font-size: 24px;
                            ">${emoji}</div>
                            <div style="
                                position: absolute;
                                width: 40px;
                                height: 40px;
                                border: 3px solid ${color};
                                border-radius: 50%;
                                animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
                                opacity: 0.3;
                            "></div>
                        </div>
                    `,
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                });
                
                L.marker([plant.latitude, plant.longitude], { icon }).addTo(plantMap);
            }, 100);
        }

        function updateDataTableForUnit(powerData, selectedUnit) {
            const unitData = powerData[selectedUnit] || [];
            const sortedData = unitData.sort((a, b) => a.year - b.year);
            
            const tableHtml = `
                <table class="power-data-table">
                    <thead>
                        <tr>
                            <th>연도</th>
                            <th>발전량 (MWh)</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sortedData.map(data => `
                            <tr>
                                <td style="font-weight: 600;">${data.year}년</td>
                                <td class="power-value">${data.value ? data.value.toLocaleString() : '-'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('dataTableContainer').innerHTML = tableHtml;
        }

        resetButton.addEventListener('click', () => {
            searchInput.value = '';
            currentFilter = 'all';
            selectedPlant = null;
            currentPlantData = null;
            availableYears = [];
            globalYAxisMin = 0;
            globalYAxisMax = 0;
            
            if (currentChart) {
                currentChart.destroy();
                currentChart = null;
            }
            
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelector('.filter-tab[data-type="all"]').classList.add('active');
            
            displaySearchResults(allPowerPlants);
            powerDataContainer.classList.remove('active');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function searchPlants(query) {
            if (!query.trim()) {
                if (currentFilter === 'all') {
                    displaySearchResults(allPowerPlants);
                } else {
                    const filtered = allPowerPlants.filter(p => p.type === currentFilter);
                    displaySearchResults(filtered);
                }
                return;
            }

            let filteredPlants = allPowerPlants;

            if (currentFilter !== 'all') {
                filteredPlants = filteredPlants.filter(p => p.type === currentFilter);
            }

            const searchQuery = query.toLowerCase();
            filteredPlants = filteredPlants.filter(p => 
                p.name.toLowerCase().includes(searchQuery) ||
                p.location.toLowerCase().includes(searchQuery) ||
                p.operator.toLowerCase().includes(searchQuery)
            );

            displaySearchResults(filteredPlants);
        }

        searchInput.addEventListener('input', (e) => {
            searchPlants(e.target.value);
        });

        document.querySelectorAll('.filter-tab').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelector('.filter-tab.active').classList.remove('active');
                button.classList.add('active');
                
                currentFilter = button.dataset.type;
                
                const searchQuery = searchInput.value.trim();
                if (searchQuery) {
                    searchPlants(searchQuery);
                } else {
                    if (currentFilter === 'all') {
                        displaySearchResults(allPowerPlants);
                    } else {
                        const filtered = allPowerPlants.filter(p => p.type === currentFilter);
                        displaySearchResults(filtered);
                    }
                }
            });
        });

        loadAllPlants();
    </script>
