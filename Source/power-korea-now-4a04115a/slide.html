<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 발전소 슬라이드 | 시각화 v3</title>
    <meta name="description" content="대한민국 전국 발전소의 연도별 설치 현황을 시각화합니다." />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background-color: #f5f5f5;
        }
        .app-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 140px;
            height: 100vh;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            z-index: 1000;
        }
        .sidebar-button {
            width: 100%;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sidebar-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .sidebar-button.active {
            background-color: rgba(255, 255, 255, 0.1);
            border-left: 4px solid #0066ff;
        }
        .sidebar-button i {
            font-size: 24px;
        }
        .sidebar-button span {
            font-size: 14px;
        }
        .main-content {
            flex: 1;
            padding: 40px;
            margin-left: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            margin-bottom: 40px;
            text-align: center;
            width: 100%;
        }
        .header h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
        }
        .header p {
            font-size: 1.2rem;
            color: #666;
            margin: 0;
        }
        .controls-container {
            width: 100%;
            max-width: 1400px;
            margin-bottom: 30px;
        }
        .selector-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .selector-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 200px;
        }
        .selector-label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        .selector {
            padding: 12px 15px;
            font-size: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            outline: none;
            max-height: 46px;
            /* -webkit-appearance: menulist; */
        }
        .selector:hover {
            border-color: #0066ff;
        }
        .selector:focus {
            border-color: #0066ff;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
        }
        .selector option {
            padding: 10px;
        }
        .selector[size] {
            max-height: 200px;
            overflow-y: auto;
        }
        .hidden {
            display: none !important;
        }
        .play-controls-top {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .play-button {
            padding: 12px 24px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            height: 46px;
        }
        .play-button:hover {
            background: #0052cc;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 102, 255, 0.3);
        }
        .play-button.playing {
            background: #ff3366;
        }
        .play-button.playing:hover {
            background: #e62958;
        }
        .slider-section {
            width: 100%;
            max-width: 1400px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .year-markers, .time-markers {
            position: relative;
            height: 40px;
            margin-top: 15px;
            width: 100%;
        }
        .year-marker, .time-marker {
            position: absolute;
            transform: translateX(-50%);
        }
        .year-marker-line, .time-marker-line {
            width: 2px;
            height: 10px;
            background: #999;
            margin: 0 auto;
        }
        .year-marker-label, .time-marker-label {
            margin-top: 5px;
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            text-align: center;
        }
        #dailySliderContainer {
            margin-top: 20px;
        }

        .daily-marker {
            position: absolute;
            transform: translateX(-50%);
        }

        .daily-marker-line {
            width: 2px;
            height: 10px;
            background: #999;
            margin: 0 auto;
        }

        .daily-marker-label {
            margin-top: 5px;
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            text-align: center;
        }
        input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(to right, var(--slider-color, #ff3366) 0%, var(--slider-color, #ff3366) 0%, #e0e0e0 0%, #e0e0e0 100%);
            border-radius: 4px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-track {
            height: 8px;
            background: transparent;
            border-radius: 4px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--slider-color, #ff3366);
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        input[type="range"]::-moz-range-track {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--slider-color, #ff3366);
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        input[type="range"]::-moz-range-progress {
            height: 8px;
            background: var(--slider-color, #ff3366);
            border-radius: 4px;
        }
        .content-section {
            width: 100%;
            max-width: 1400px;
            display: flex;
            gap: 30px;
        }
        .chart-container {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .chart-wrapper {
            position: relative;
            height: 400px;
        }
        .map-container {
            flex: 0 0 500px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 20px;
            align-self: flex-start;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        .map-wrapper {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            overflow: hidden;
        }
        .map-info {
            margin-top: 15px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 14px;
        }
        .map-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            gap: 10px;
        }
        .map-info-row:last-child {
            margin-bottom: 0;
        }
        .map-info-label {
            color: #666;
            font-weight: 500;
            min-width: 80px;
        }
        .map-info-value {
            font-weight: 600;
            color: #333;
            text-align: right;
            flex: 1;
        }
        .scroll-buttons {
            position: fixed;
            right: 30px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 999;
        }
        .scroll-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #0066ff;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3);
            transition: all 0.3s;
        }
        .scroll-btn:hover {
            background: #0052cc;
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(0, 102, 255, 0.4);
        }
        .scroll-btn:active {
            transform: scale(0.95);
        }
        .scroll-btn.hidden {
            opacity: 0;
            pointer-events: none;
        }
        @keyframes ping {
            75%, 100% {
                transform: scale(2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <button class="sidebar-button" data-tab="map" onclick="window.location.href='index.html'">
                <i class='bx bx-map'></i>
                <span>Map</span>
            </button>
            <button class="sidebar-button active" data-tab="slide">
                <i class='bx bx-slider'></i>
                <span>Slide</span>
            </button>
            <button class="sidebar-button" data-tab="game" onclick="window.location.href='gameplatform.html'">
                <i class='bx bx-game'></i>
                <span>Game</span>
            </button>
            <button class="sidebar-button" data-tab="education" onclick="window.location.href='education.html'">
                <i class='bx bx-book-reader'></i>
                <span>Education</span>
            </button>
            <button class="sidebar-button" data-tab="login" onclick="window.location.href='login.html'">
                <i class='bx bx-log-in'></i>
                <span>Login</span>
            </button>
        </aside>

        <div class="scroll-buttons">
            <button class="scroll-btn" id="scrollToTop" title="맨 위로">
                <i class='bx bx-chevron-up'></i>
            </button>
            <button class="scroll-btn" id="scrollToBottom" title="맨 아래로">
                <i class='bx bx-chevron-down'></i>
            </button>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>대한민국 발전소 현황</h1>
                <p>연도별 발전소 설치 시각화 시스템</p>
            </div>

            <div class="controls-container">
                <div class="selector-row">
                    <div class="selector-group">
                        <label class="selector-label">발전소 유형</label>
                        <select class="selector" id="typeSelector">
                            <option value="">유형 선택</option>
                            <option value="nuclear">원자력</option>
                            <option value="thermal">화력</option>
                            <option value="hydro">수력</option>
                            <option value="solar">태양광</option>
                            <option value="wind">풍력</option>
                        </select>
                    </div>

                    <div class="selector-group hidden" id="plantSelectorGroup">
                        <label class="selector-label">발전소 선택</label>
                        <select class="selector" id="plantSelector" onfocus="this.size=6;" onblur="this.size=1;" onchange="this.size=1; this.blur();">
                            <option value="">발전소 선택</option>
                        </select>
                    </div>

                    <div class="selector-group hidden" id="unitSelectorGroup">
                        <label class="selector-label">호기 선택</label>
                        <select class="selector" id="unitSelector">
                            <option value="">호기 선택</option>
                        </select>
                    </div>

                    <div class="selector-group hidden" id="dateSelectorGroup">
                        <label class="selector-label">일자 선택</label>
                        <select class="selector" id="dateSelector">
                            <option value="">일자 선택</option>
                        </select>
                    </div>

                    <div class="play-controls-top">
                        <button class="play-button" id="playButton" disabled>
                            <i class='bx bx-play'></i>
                            <span>재생</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="slider-section" id="sliderSection">
                <input type="range" id="yearSlider" min="0" max="0" value="0" step="1" disabled />
                <div id="yearMarkers" class="year-markers"></div>
                <div id="timeSliderContainer" class="hidden">
                    <input type="range" id="timeSlider" min="0" max="23" value="0" step="1" disabled />
                    <div id="timeMarkers" class="time-markers"></div>
                </div>
                <div id="dailySliderContainer" class="hidden">
                    <input type="range" id="dailySlider" min="0" max="0" value="0" step="1" disabled />
                    <div id="dailyMarkers" class="time-markers"></div>
                </div>
            </div>

            <div class="content-section">
                <div class="chart-container">
                    <div class="chart-wrapper">
                        <canvas id="powerChart"></canvas>
                    </div>
                </div>

                <div class="map-container">
                    <div class="map-wrapper" id="plant-map"></div>
                    <div class="map-info" id="mapInfo">
                        <div style="text-align: center; color: #999;">발전소를 선택해주세요</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allPowerPlants = [];
        let currentChart = null;
        let currentMap = null;
        let playInterval = null;
        let isPlaying = false;
        
        let nuclearPowerData = {};
        let plantUnits = {};
        let thermalPowerData = {};
        let solarPowerData = {};
        let windPowerData = {};
        let hydroPowerData = {};
        let hydroKHNPData = {};

        let fullChartData = [];
        let currentPlantInfo = null;

        let dailySlider;
        let dailySliderContainer;

        const iconEmoji = {
            'hydro': '💧',
            'nuclear': '☢️',
            'wind': '💨',
            'solar': '☀️',
            'thermal': '🔥'
        };

        const colorMap = { 
            hydro: "#00aaff",
            nuclear: "#ff3366",
            wind: "#90ee90",
            solar: "#ffd700",
            thermal: "#ff6347"
        };

        async function fetchAllPlants() {
            try {
                const response = await fetch('http://localhost:3000/api/plants');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const responseData = await response.json();
                
                let data = [];
                if (Array.isArray(responseData)) {
                    data = responseData;
                    plantUnits = {};
                } else if (responseData.plants && Array.isArray(responseData.plants)) {
                    data = responseData.plants;
                    plantUnits = responseData.plantUnits || {};
                } else {
                    throw new Error('잘못된 응답 형식');
                }
                
                console.log('✅ 발전소 데이터:', data.length + '개');
                
                // ✅ 발전소 유형별 개수 확인
                const typeCounts = {};
                data.forEach(plant => {
                    const type = plant.plant_type || 'unknown';
                    typeCounts[type] = (typeCounts[type] || 0) + 1;
                });
                console.log('📊 발전소 유형별 원본 데이터:', typeCounts);
                
                return data.map((plant, index) => {
                    const plantType = plant.plant_type || '알 수 없음';
                    
                    let type = 'thermal';
                    const typeStr = String(plantType).toLowerCase();
                    
                    if (typeStr.includes('수력') || typeStr === 'hydro') {
                        type = 'hydro';
                    } else if (typeStr.includes('원자력') || typeStr === 'nuclear') {
                        type = 'nuclear';
                    } else if (typeStr.includes('풍력') || typeStr === 'wind') {
                        type = 'wind';
                    } else if (typeStr.includes('태양광') || typeStr === 'solar') {
                        type = 'solar';
                    } else if (typeStr.includes('화력') || typeStr === 'thermal') {
                        type = 'thermal';
                    }
                    
                    const plantName = plant.plant_name || '이름 없음';
                    const address = plant.adress || '';
                    
                    let matchedPowerName = null;
                    let units = [];
                    if (type === 'nuclear') {
                        matchedPowerName = plantName;
                        units = plantUnits[plantName] || [];
                    }
                    
                    return {
                        id: `${type}_${index}`,
                        name: plantName,
                        plant_name: plantName,
                        type: type,
                        operator: plant.business || '정보 없음',
                        fullAddress: address || '위치 정보 없음',
                        latitude: parseFloat(plant.latitude),
                        longitude: parseFloat(plant.longitude),
                        capacity: parseFloat(plant.capacity) || 100,
                        powerName: matchedPowerName,
                        units: units
                    };
                });
            } catch (error) {
                console.error('❌ 발전소 데이터 로드 실패:', error);
                return [];
            }
        }

        async function fetchNuclearPowerData() {
            try {
                const res = await fetch('http://localhost:3000/api/nuclear/full');
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                
                const data = await res.json();
                nuclearPowerData = {};
                plantUnits = {};

                data.forEach(plant => {
                    if (plant.powerData) {
                        Object.entries(plant.powerData).forEach(([unit, arr]) => {
                            const key = plant.plant_name + unit;
                            nuclearPowerData[key] = arr;
                        });
                    }
                    if (plant.units) {
                        plantUnits[plant.plant_name] = plant.units;
                    }
                });

                console.log("⚡ 원자력 발전량 데이터:", Object.keys(nuclearPowerData).length + '개 호기');
            } catch (err) { 
                console.error('❌ 원자력 발전량 데이터 로드 실패:', err); 
                nuclearPowerData = {};
                plantUnits = {};
            }
        }

        async function loadThermalPowerData() {
            const response = await fetch('http://localhost:3000/api/thermal/power');
            const json = await response.json();
            thermalPowerData = json.data;
            console.log("🔥 화력 발전량 데이터 로드 완료");
            console.log("🔥 화력 호기 목록:", Object.keys(thermalPowerData));
        }

        async function loadSolarPowerData() {
            const response = await fetch('http://localhost:3000/api/solar/power');
            const json = await response.json();
            solarPowerData = json.data;
            console.log("☀️ 태양광 발전량 데이터 로드 완료");
        }

        async function loadWindPowerData() {
            const response = await fetch('http://localhost:3000/api/wind/power');
            const json = await response.json();
            windPowerData = json.data;
            console.log("💨 풍력 발전량 데이터 로드 완료");
        }

        async function loadHydroPowerData() {
            const response = await fetch('http://localhost:3000/api/hydro/daily-power');
            const json = await response.json();
            hydroPowerData = json.data;
            console.log("💧 수력 발전량 데이터 로드 완료 (수자원공사)");
            console.log("   - 발전소 목록:", Object.keys(hydroPowerData));
            console.log("   - 첫 번째 발전소 데이터 샘플:", Object.keys(hydroPowerData[Object.keys(hydroPowerData)[0]] || {}).slice(0, 5));

            const khnpResponse = await fetch('http://localhost:3000/api/hydro/khnp-yearly');
            const khnpJson = await khnpResponse.json();
            hydroKHNPData = khnpJson.data;
            console.log("💧 수력 발전량 데이터 로드 완료 (한수원)");
            console.log("   - 발전소 목록:", Object.keys(hydroKHNPData));
            console.log("   - 첫 번째 발전소 데이터:", hydroKHNPData[Object.keys(hydroKHNPData)[0]]);
        }

        async function loadAllPlants() {
            console.log('🔄 발전소 데이터 로드 시작');
            
            allPowerPlants = await fetchAllPlants();
            
            console.log('⏳ 발전량 데이터 로드 중...');
            await Promise.all([
                fetchNuclearPowerData(),
                loadThermalPowerData(),
                loadSolarPowerData(),
                loadWindPowerData(),
                loadHydroPowerData()
            ]);
            
            console.log('✅ 모든 데이터 로드 완료');
            
            // ✅ 최종 발전소 유형별 개수 확인
            const finalTypeCounts = {};
            allPowerPlants.forEach(plant => {
                const type = plant.type || 'unknown';
                finalTypeCounts[type] = (finalTypeCounts[type] || 0) + 1;
            });
            console.log('🏭 최종 발전소 분류:', finalTypeCounts);
            console.log('🔥 화력 발전소 목록:', allPowerPlants.filter(p => p.type === 'thermal').map(p => `${p.name} (${p.latitude}, ${p.longitude})`));
        }

        function createChart(canvasId, data, plantName) {
            if (currentChart) {
                currentChart.destroy();
                currentChart = null;
            }

            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            
            const isYearData = data.length > 0 && data[0].year > 100;
            const labels = data.map(d => isYearData ? d.year + '년' : d.year + '시');
            const values = data.map(d => d.value || 0);

            const selectedType = typeSelector.value || 'thermal';
            const chartColor = colorMap[selectedType] || '#ff3366';

            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '발전량 (MWh)',
                        data: values,
                        borderColor: chartColor,
                        backgroundColor: chartColor + '1a',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        pointBackgroundColor: chartColor,
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: {
                            display: true,
                            text: plantName,

            slider.style.background = `linear-gradient(to right, ${color} 0%, ${color} ${percentage}%, #e0e0e0 ${percentage}%, #e0e0e0 100%)`;

            const dataKey = plantName + unit;

            fullChartData = powerData;
            
            const years = powerData.map(d => d.year + '년');

            document.getElementById('yearSlider').style.display = 'block';
            if (yearMarkers) yearMarkers.style.display = 'block';

            timeSliderContainer.classList.add('hidden');

            const totalYears = years.length;
            const step = Math.ceil(totalYears / 10);
            
            for (let i = 0; i < totalYears; i += step) {
                const percentage = (i / (totalYears - 1)) * 100;
                const marker = document.createElement('div');
                marker.className = 'year-marker';
                marker.style.left = percentage + '%';
                marker.innerHTML = `
                    <div class="year-marker-line"></div>
                    <div class="year-marker-label">${years[i]}</div>
                `;
                yearMarkers.appendChild(marker);

            timeSliderContainer.classList.add('hidden');
            
            createChart('powerChart', fullChartData, `${plantName} ${unit.replace('#', '')}호기`);
            updateChartWithSlider(0);
            updateSliderProgress(yearSlider);
        }

        function loadHydroData(plantName) {
            const isKwater = currentPlantInfo && (currentPlantInfo.operator.includes('한국수자원공사') || currentPlantInfo.operator.includes('K-water'));
            const isKHNP = currentPlantInfo && (currentPlantInfo.operator.includes('한국수력원자력') || currentPlantInfo.operator.includes('한수원'));
            
            console.log(`💧 수력 데이터 로드: ${plantName}`);
            console.log(`   - 수자원공사: ${isKwater}`);
            console.log(`   - 한수원: ${isKHNP}`);
            
            if ((isKwater && !hydroPowerData[plantName]) || (isKHNP && !hydroKHNPData[plantName])) {
                console.error(`❌ 발전량 데이터 없음: ${plantName}`);
                if (currentChart) {
                    currentChart.destroy();
                    currentChart = null;
                }
                const canvas = document.getElementById('powerChart');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.font = '16px "Segoe UI"';
                ctx.fillStyle = '#999';
                ctx.textAlign = 'center';
                ctx.fillText('해당 발전소의 발전량 데이터가 없습니다.', canvas.width / 2, canvas.height / 2);
                
                yearSlider.disabled = true;
                playButton.disabled = true;
                return;
            }

            const yearMarkers = document.getElementById('yearMarkers');
            const timeMarkers = document.getElementById('timeMarkers');

            if (isKwater && hydroPowerData[plantName]) {
                console.log(`✅ 수자원공사 데이터 처리 시작`);
                const damData = hydroPowerData[plantName];
                console.log(`   - 데이터 개수: ${Object.keys(damData).length}일`);
                
                // ✅ 일별 데이터를 연도별로 집계
                const chartData = Object.entries(damData)
                    .sort(([a], [b]) => new Date(a) - new Date(b))
                    .map(([date, value]) => ({
                        year: new Date(date).getFullYear(),
                        value: Number(value)
                    }));
                
                const yearlyData = {};
                chartData.forEach(item => {
                    if (!yearlyData[item.year]) {
                        yearlyData[item.year] = 0;
                    }
                    yearlyData[item.year] += item.value;
                });
                
                fullChartData = Object.entries(yearlyData)
                    .sort(([a], [b]) => Number(a) - Number(b))
                    .map(([year, value]) => ({ year: Number(year), value }));
                
                console.log(`   - 연도별 집계 완료: ${fullChartData.length}년`);
                console.log(`   - 연도 범위: ${fullChartData[0]?.year} ~ ${fullChartData[fullChartData.length - 1]?.year}`);
                
                const years = fullChartData.map(d => d.year + '년');
                
                yearSlider.max = fullChartData.length - 1;
                yearSlider.value = 0;
                yearSlider.disabled = false;
                playButton.disabled = false;

                // ✅ yearSlider 표시
                document.getElementById('yearSlider').style.display = 'block';
                if (yearMarkers) yearMarkers.style.display = 'block';

                timeSliderContainer.classList.add('hidden');
                dailySliderContainer.classList.add('hidden');
                
                yearMarkers.innerHTML = '';
                timeMarkers.innerHTML = '';

                const totalYears = years.length;
                const step = Math.ceil(totalYears / 10);
                
                for (let i = 0; i < totalYears; i += step) {
                    const percentage = (i / (totalYears - 1)) * 100;
                    const marker = document.createElement('div');
                    marker.className = 'year-marker';
                    marker.style.left = percentage + '%';
                    marker.innerHTML = `
                        <div class="year-marker-line"></div>
                        <div class="year-marker-label">${years[i]}</div>
                    `;
                    yearMarkers.appendChild(marker);
                }
                
                console.log(`✅ 차트 생성: ${plantName} (${fullChartData.length}개 데이터)`);
                createChart('powerChart', fullChartData, plantName);
                updateChartWithSlider(0);
                updateSliderProgress(yearSlider);
                
            } else if (isKHNP && hydroKHNPData[plantName]) {
                console.log(`✅ 한수원 데이터 처리 시작`);
                fullChartData = hydroKHNPData[plantName];
                console.log(`   - 데이터 개수: ${fullChartData.length}년`);
                
                const years = fullChartData.map(d => d.year + '년');
                
                yearSlider.max = fullChartData.length - 1;
                yearSlider.value = 0;
                yearSlider.disabled = false;
                playButton.disabled = false;

                // ✅ yearSlider 표시
                document.getElementById('yearSlider').style.display = 'block';
                if (yearMarkers) yearMarkers.style.display = 'block';

                timeSliderContainer.classList.add('hidden');
                dailySliderContainer.classList.add('hidden');
                
                yearMarkers.innerHTML = '';
                timeMarkers.innerHTML = '';

                const totalYears = years.length;
                const step = Math.ceil(totalYears / 10);
                
                for (let i = 0; i < totalYears; i += step) {
                    const percentage = (i / (totalYears - 1)) * 100;
                    const marker = document.createElement('div');
                    marker.className = 'year-marker';
                    marker.style.left = percentage + '%';
                    marker.innerHTML = `
                        <div class="year-marker-line"></div>
                        <div class="year-marker-label">${years[i]}</div>
                    `;
                    yearMarkers.appendChild(marker);
                }
                
                console.log(`✅ 차트 생성: ${plantName} (${fullChartData.length}개 데이터)`);
                createChart('powerChart', fullChartData, plantName);
                updateChartWithSlider(0);
                updateSliderProgress(yearSlider);
            }
        }

        yearSlider.addEventListener('input', function() {
            const index = parseInt(this.value);
            const years = fullChartData.map(d => d.year + '년');
            updateChartWithSlider(index);
        });

        timeSlider.addEventListener('input', function() {
            const hour = parseInt(this.value);
            updateChartWithSlider(hour);
        });

        playButton.addEventListener('click', function() {
            if (isPlaying) {
                stopPlayback();
                return;
            }
            
            isPlaying = true;
            this.innerHTML = '<i class="bx bx-pause"></i><span>정지</span>';
            this.classList.add('playing');
            
            const selectedType = typeSelector.value;
            const isKwater = currentPlantInfo && (currentPlantInfo.operator.includes('한국수자원공사') || currentPlantInfo.operator.includes('K-water'));
            
            if (selectedType === 'hydro' && isKwater) {
                // 수자원공사 수력은 일별 슬라이더 사용
                playInterval = setInterval(() => {
                    let current = parseInt(dailySlider.value);
                    if (current >= parseInt(dailySlider.max)) {
                        stopPlayback();
                        return;
                    } else {
                        current++;
                    }
                    dailySlider.value = current;
                    updateSliderProgress(dailySlider);
                    updateChartWithSlider(current);
                }, 500);
            } else if (selectedType === 'nuclear' || (selectedType === 'hydro' && !isKwater)) {
                playInterval = setInterval(() => {
                    let current = parseInt(yearSlider.value);
                    if (current >= parseInt(yearSlider.max)) {
                        stopPlayback();
                        return;
                    } else {
                        current++;
                    }
                    yearSlider.value = current;
                    updateSliderProgress(yearSlider);
                    updateChartWithSlider(current);
                }, 500);
            } else {
                playInterval = setInterval(() => {
                    let current = parseInt(timeSlider.value);
                    if (current >= 23) {
                        stopPlayback();
                        return;
                    } else {
                        current++;
                    }
                    timeSlider.value = current;
                    updateSliderProgress(timeSlider);
                    updateChartWithSlider(current);
                }, 500);
            }
        });

        const scrollToTopBtn = document.getElementById('scrollToTop');
        const scrollToBottomBtn = document.getElementById('scrollToBottom');

        scrollToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        scrollToBottomBtn.addEventListener('click', () => {
            window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
        });

        window.addEventListener('scroll', () => {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight;
            const clientHeight = document.documentElement.clientHeight;

            if (scrollTop < 100) {
                scrollToTopBtn.classList.add('hidden');
            } else {
                scrollToTopBtn.classList.remove('hidden');
            }

            if (scrollTop + clientHeight >= scrollHeight - 100) {
                scrollToBottomBtn.classList.add('hidden');
            } else {
                scrollToBottomBtn.classList.remove('hidden');
            }
        });

        window.dispatchEvent(new Event('scroll'));

        loadAllPlants();

        // 게임 버튼 클릭 시 로그인 체크
        document.querySelector('.sidebar-button[data-tab="game"]')?.addEventListener('click', (e) => {
            const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
            if(!isLoggedIn){
                e.preventDefault();
                alert('게임을 이용하려면 먼저 로그인해야 합니다.');
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
