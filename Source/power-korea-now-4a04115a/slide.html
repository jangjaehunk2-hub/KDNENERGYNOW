    <script>
        let allPowerPlants = [];
        let currentFilter = 'all';
        let selectedPlant = null;
        let currentChart = null;
        let playInterval = null;
        let isPlaying = false;
        
        // 발전량 데이터 저장
        let nuclearPowerData = {};
        let plantUnits = {};
        let thermalPowerData = {};
        let solarPowerData = {};
        let windPowerData = {};
        let hydroPowerData = {};
        let hydroKHNPData = {};

        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const powerDataContainer = document.getElementById('powerDataContainer');
        const powerDataContent = document.getElementById('powerDataContent');
        const selectedPlantName = document.getElementById('selectedPlantName');
        const resetButton = document.getElementById('resetButton');

        const iconEmoji = {
            'hydro': '💧',
            'nuclear': '☢️',
            'wind': '💨',
            'solar': '☀️',
            'thermal': '🔥'
        };

        const colorMap = { 
            hydro: "#00aaff",
            nuclear: "#ff3366",
            wind: "#90ee90",
            solar: "#ffd700",
            thermal: "#ff6347"
        };

        function extractDetailedLocation(address) {
            if (!address) return '상세 위치 정보 없음';
            if (address.length > 60) {
                return address.substring(0, 60) + '...';
            }
            return address;
        }

        // ===== 발전소 데이터 가져오기 =====
        async function fetchAllPlants() {
            try {
                const response = await fetch('http://localhost:3000/api/plants');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const responseData = await response.json();
                
                let data = [];
                if (Array.isArray(responseData)) {
                    data = responseData;
                    plantUnits = {};
                } else if (responseData.plants && Array.isArray(responseData.plants)) {
                    data = responseData.plants;
                    plantUnits = responseData.plantUnits || {};
                } else {
                    throw new Error('잘못된 응답 형식');
                }
                
                console.log('✅ 발전소 데이터:', data.length + '개');
                
                return data.map((plant, index) => {
                    const plantType = plant.plant_type || '알 수 없음';
                    
                    let type = 'thermal';
                    const typeStr = String(plantType).toLowerCase();
                    
                    if (typeStr.includes('수력') || typeStr === 'hydro') {
                        type = 'hydro';
                    } else if (typeStr.includes('원자력') || typeStr === 'nuclear') {
                        type = 'nuclear';
                    } else if (typeStr.includes('풍력') || typeStr === 'wind') {
                        type = 'wind';
                    } else if (typeStr.includes('태양광') || typeStr === 'solar') {
                        type = 'solar';
                    } else if (typeStr.includes('화력') || typeStr === 'thermal') {
                        type = 'thermal';
                    }
                    
                    const plantName = plant.plant_name || '이름 없음';
                    const address = plant.adress || '';
                    
                    let location = '정보 없음';
                    if (address) {
                        if (address.includes('서울')) location = '서울';
                        else if (address.includes('부산')) location = '부산';
                        else if (address.includes('대구')) location = '대구';
                        else if (address.includes('인천')) location = '인천';
                        else if (address.includes('광주')) location = '광주';
                        else if (address.includes('대전')) location = '대전';
                        else if (address.includes('울산')) location = '울산';
                        else if (address.includes('세종')) location = '세종';
                        else if (address.includes('경기')) location = '경기';
                        else if (address.includes('강원')) location = '강원';
                        else if (address.includes('충청북도') || address.includes('충북')) location = '충북';
                        else if (address.includes('충청남도') || address.includes('충남')) location = '충남';
                        else if (address.includes('전라북도') || address.includes('전북')) location = '전북';
                        else if (address.includes('전라남도') || address.includes('전남')) location = '전남';
                        else if (address.includes('경상북도') || address.includes('경북')) location = '경북';
                        else if (address.includes('경상남도') || address.includes('경남')) location = '경남';
                        else if (address.includes('제주')) location = '제주';
                        else {
                            const cityMatch = address.match(/([가-힣]+시|[가-힣]+군)/);
                            if (cityMatch) location = cityMatch[1];
                            else location = address.split(' ')[0] || '정보 없음';
                        }
                    }
                    
                    let matchedPowerName = null;
                    let units = [];
                    if (type === 'nuclear') {
                        matchedPowerName = plantName;
                        units = plantUnits[plantName] || [];
                    }
                    
                    return {
                        id: `${type}_${index}`,
                        name: plantName,
                        plant_name: plantName,
                        type: type,
                        operator: plant.business || '정보 없음',
                        unit: plant.remark || '',
                        location: location,
                        fullAddress: address || '위치 정보 없음',
                        detailedLocation: extractDetailedLocation(address),
                        latitude: parseFloat(plant.latitude),
                        longitude: parseFloat(plant.longitude),
                        capacity: parseFloat(plant.capacity) || 100,
                        powerName: matchedPowerName,
                        units: units
                    };
                });
            } catch (error) {
                console.error('❌ 발전소 데이터 로드 실패:', error);
                return [];
            }
        }

        async function fetchNuclearPowerData() {
            try {
                const res = await fetch('http://localhost:3000/api/nuclear/full');
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                
                const data = await res.json();
                nuclearPowerData = {};
                plantUnits = {};

                data.forEach(plant => {
                    if (plant.powerData) {
                        Object.entries(plant.powerData).forEach(([unit, arr]) => {
                            const key = plant.plant_name + unit;
                            nuclearPowerData[key] = arr;
                        });
                    }
                    if (plant.units) {
                        plantUnits[plant.plant_name] = plant.units;
                    }
                });

                console.log("⚡ 원자력 발전량 데이터:", Object.keys(nuclearPowerData).length + '개 호기');
            } catch (err) { 
                console.error('❌ 원자력 발전량 데이터 로드 실패:', err); 
                nuclearPowerData = {};
                plantUnits = {};
            }
        }

        function createYearMarkers(dates) {
            const container = document.getElementById('yearMarkers');
            if (!container) return;
            
            container.innerHTML = '';
            const totalItems = dates.length;
            const step = Math.ceil(totalItems / 10);
            
            for (let i = 0; i < totalItems; i += step) {
                const percentage = (i / (totalItems - 1)) * 100;
                const label = dates[i];
                
                const marker = document.createElement('div');
                marker.className = 'year-marker';
                marker.style.left = percentage + '%';
                marker.innerHTML = `
                    <div class="year-marker-line"></div>
                    <div class="year-marker-label">${label}</div>
                `;
                container.appendChild(marker);
            }
        }

        function createTimeMarkers() {
            const container = document.getElementById('timeMarkers');
            if (!container) return;
            
            container.innerHTML = '';
            const hours = [0, 4, 8, 12, 16, 20, 23];
            
            hours.forEach(hour => {
                const percentage = (hour / 23) * 100;
                
                const marker = document.createElement('div');
                marker.className = 'time-marker';
                marker.style.left = percentage + '%';
                marker.innerHTML = `
                    <div class="time-marker-line"></div>
                    <div class="time-marker-label">${hour}시</div>

                container.appendChild(marker);
            });

        function stopPlayback() {
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
            }
            isPlaying = false;
            const playButton = document.getElementById('playButton');
            if (playButton) {
                playButton.innerHTML = '<i class="bx bx-play"></i><span>재생</span>';
                playButton.classList.remove('playing');
            }
        }

        function startPlayback(yearSlider, timeSlider, dates, updateFunction) {
            if (isPlaying) {
                stopPlayback();
                return;
            }
            
            isPlaying = true;
            const playButton = document.getElementById('playButton');
            if (playButton) {
                playButton.innerHTML = '<i class="bx bx-pause"></i><span>정지</span>';
                playButton.classList.add('playing');
            }
            
            playInterval = setInterval(() => {
                let currentTime = parseInt(timeSlider.value);
                let currentYear = parseInt(yearSlider.value);
                
                if (currentTime >= 23) {
                    if (currentYear >= dates.length - 1) {
                        currentYear = 0;
                        currentTime = 0;
                    } else {
                        currentYear++;
                        currentTime = 0;
                    }
                } else {
                    currentTime++;
                }
                
                yearSlider.value = currentYear;
                timeSlider.value = currentTime;
                updateFunction(currentYear, currentTime);
            }, 500);
        }

            const mapDetailHeader = document.getElementById('mapDetailHeader');

            mapDetailHeader.addEventListener('click', () => {

                }
            });

            // ===== 원자력 발전소 =====

                try {

                    if (units.length === 0) {
                        powerDataContent.innerHTML = mapHTML + '<div class="loading-power">📊 호기 정보가 없습니다</div>';
                        return;
                    }

                    let html = mapHTML + `
                        <div class="unit-selector-container">

                            <select class="unit-selector" id="unitSelector">

                            </select>
                        </div>
                        <div id="sliderContainer"></div>
                        <div class="chart-container">
                            <div class="chart-wrapper">
                                <canvas id="powerChart"></canvas>
                            </div>
                        </div>
                    `;
                    
                    powerDataContent.innerHTML = html;
                    
                    const unitSelector = document.getElementById('unitSelector');
                    const sliderContainer = document.getElementById('sliderContainer');
                    
                    function updateSlider() {
                        stopPlayback();
                        const selectedUnit = unitSelector.value;
                        const dataKey = plant.plant_name + selectedUnit;
                        const powerData = nuclearPowerData[dataKey];
                        
                        if (powerData && powerData.length > 0) {
                            const years = powerData.map(d => d.year + '년');
                            
                            sliderContainer.innerHTML = `
                                <div class="slider-controls">
                                    <div class="slider-container" style="width: 90%;">
                                        <div class="year-display" id="yearDisplay">${years[0]}</div>
                                        <div class="year-markers" id="yearMarkers"></div>
                                        <input type="range" 
                                            id="yearSlider" 
                                            min="0" 
                                            max="${years.length - 1}" 
                                            value="0" 
                                            step="1" />
                                        <div class="year-range">
                                            <span>${years[0]}</span>
                                            <span>${years[years.length - 1]}</span>
                                        </div>
                                        <div class="play-controls">
                                            <button class="play-button" id="playButton">
                                                <i class='bx bx-play'></i>
                                                <span>재생</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `;
                            
                            const yearSlider = document.getElementById('yearSlider');
                            const yearDisplay = document.getElementById('yearDisplay');
                            const playButton = document.getElementById('playButton');
                            
                            const yearMarkers = document.getElementById('yearMarkers');
                            yearMarkers.innerHTML = '';
                            const totalYears = years.length;
                            const step = Math.ceil(totalYears / 10);
                            
                            for (let i = 0; i < totalYears; i += step) {
                                const percentage = (i / (totalYears - 1)) * 100;
                                const marker = document.createElement('div');
                                marker.className = 'year-marker';
                                marker.style.left = percentage + '%';
                                marker.innerHTML = `
                                    <div class="year-marker-line"></div>
                                    <div class="year-marker-label">${years[i]}</div>
                                `;
                                yearMarkers.appendChild(marker);
                            }
                            
                            function updateChart(yearIndex) {
                                yearDisplay.textContent = years[yearIndex];
                                
                                const chartData = powerData.slice(0, yearIndex + 1);
                                createPowerChart('powerChart', chartData, `${plant.name} ${formatUnitName(selectedUnit)}`);
                            }
                            
                            yearSlider.addEventListener('input', function() {
                                updateChart(parseInt(this.value));
                            });
                            
                            playButton.addEventListener('click', function() {

                                    stopPlayback();

                                this.innerHTML = '<i class="bx bx-pause"></i><span>정지</span>';
                                this.classList.add('playing');
                                
                                playInterval = setInterval(() => {

                                    if (currentYear >= years.length - 1) {

                                    } else {
                                        currentYear++;
                                    }
                                    yearSlider.value = currentYear;
                                    updateChart(currentYear);
                                }, 500);
                            });
                            
                            updateChart(0);
                        } else {
                            sliderContainer.innerHTML = '<div class="loading-power">📊 발전량 데이터가 없습니다</div>';

                    }
                    
                    unitSelector.addEventListener('change', updateSlider);
                    updateSlider();
                    
                } catch (error) {
                    console.error('❌ 원자력 데이터 처리 실패:', error);

            // ===== 수력 발전소 =====

                    const isKHNP = plant.operator && (plant.operator.includes('한국수력원자력') || plant.operator.includes('한수원'));
                    
                    if (isKwater && hydroPowerData[plant.name]) {
                        const damData = hydroPowerData[plant.name];
                        const chartData = Object.entries(damData)
                            .sort(([a], [b]) => new Date(a) - new Date(b))
                            .map(([date, value]) => ({
                                year: new Date(date).getFullYear(),
                                value: Number(value)
                            }));
                        
                        const yearlyData = {};
                        chartData.forEach(item => {
                            if (!yearlyData[item.year]) {
                                yearlyData[item.year] = 0;
                            }
                            yearlyData[item.year] += item.value;
                        });
                        
                        const finalData = Object.entries(yearlyData)
                            .sort(([a], [b]) => Number(a) - Number(b))
                            .map(([year, value]) => ({ year: Number(year), value }));
                        
                        let html = mapHTML + `
                            <div class="chart-container">
                                <div class="chart-wrapper">
                                    <canvas id="powerChart"></canvas>
                                </div>
                            </div>
                        `;
                        
                        powerDataContent.innerHTML = html;
                        createPowerChart('powerChart', finalData, plant.name);
                        
                    } else if (isKHNP && hydroKHNPData[plant.name]) {
                        const yearlyData = hydroKHNPData[plant.name];
                        
                        let html = mapHTML + `
                            <div class="chart-container">
                                <div class="chart-wrapper">
                                    <canvas id="powerChart"></canvas>
                                </div>
                            </div>
                        `;
                        
                        powerDataContent.innerHTML = html;
                        createPowerChart('powerChart', yearlyData, plant.name);
                    } else {
                        powerDataContent.innerHTML = mapHTML + '<div class="loading-power">📊 발전량 데이터가 없습니다</div>';
                    }
                } catch (error) {
                    console.error('❌ 수력 데이터 처리 실패:', error);
                    powerDataContent.innerHTML = mapHTML + '<div class="loading-power">❌ 데이터 처리 실패</div>';
                }
            }
            // ===== 화력 발전소 =====
            else if (plant.type === 'thermal') {
                try {
                    const units = Object.keys(thermalPowerData);
                    
                    if (units.length === 0) {
                        powerDataContent.innerHTML = mapHTML + '<div class="loading-power">📊 발전량 데이터가 없습니다</div>';
                        return;
                    }

                    let html = mapHTML + `
                        <div class="unit-selector-container">
                            <label class="unit-selector-label">호기 선택</label>
                            <select class="unit-selector" id="unitSelector">
                                ${units.map(unit => `<option value="${unit}">${unit}</option>`).join('')}
                            </select>
                        </div>
                        <div id="sliderContainer"></div>
                        <div class="chart-container">
                            <div class="chart-wrapper">
                                <canvas id="powerChart"></canvas>
                            </div>
                        </div>
                    `;
                    
                    powerDataContent.innerHTML = html;
                    
                    const unitSelector = document.getElementById('unitSelector');
                    const sliderContainer = document.getElementById('sliderContainer');
                    let currentDates = [];
                    let currentUnitData = null;
                    
                    function updateSlider() {
                        stopPlayback();
                        const selectedUnit = unitSelector.value;
                        currentUnitData = thermalPowerData[selectedUnit];
                        
                        if (currentUnitData) {
                            currentDates = Object.keys(currentUnitData).sort();
                            const formattedDates = currentDates.map(d => {
                                const dateObj = new Date(d);
                                return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
                            });
                            
                            sliderContainer.innerHTML = createTimeSlider(formattedDates, unitSelector, currentUnitData, selectedUnit, false);
                            
                            const yearSlider = document.getElementById('yearSlider');
                            const timeSlider = document.getElementById('timeSlider');
                            const yearDisplay = document.getElementById('yearDisplay');
                            const timeDisplay = document.getElementById('timeDisplay');
                            const playButton = document.getElementById('playButton');
                            
                            createYearMarkers(formattedDates);
                            createTimeMarkers();
                            
                            function updateChart(dateIndex, hourIndex) {
                                const selectedDate = currentDates[dateIndex];
                                const dateObj = new Date(selectedDate);
                                const displayDate = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
                                
                                yearDisplay.textContent = displayDate;
                                timeDisplay.textContent = hourIndex + '시';
                                
                                const hourlyData = currentUnitData[selectedDate];
                                if (!hourlyData) return;
                                
                                const chartData = Object.entries(hourlyData)
                                    .sort(([a], [b]) => Number(a) - Number(b))
                                    .slice(0, hourIndex + 1)
                                    .map(([hour, value]) => ({
                                        year: Number(hour),
                                        value: Number(value)
                                    }));
                                
                                createPowerChart('powerChart', chartData, `${selectedUnit} - ${displayDate} ${hourIndex}시까지`);
                            }
                            
                            yearSlider.addEventListener('input', function() {
                                updateChart(parseInt(this.value), parseInt(timeSlider.value));
                            });
                            
                            timeSlider.addEventListener('input', function() {
                                updateChart(parseInt(yearSlider.value), parseInt(this.value));
                            });
                            
                            playButton.addEventListener('click', function() {
                                startPlayback(yearSlider, timeSlider, currentDates, updateChart);
                            });
                            
                            updateChart(0, 0);
                        }
                    }
                    
                    unitSelector.addEventListener('change', updateSlider);
                    updateSlider();
                    
                } catch (error) {
                    console.error('❌ 화력 데이터 처리 실패:', error);
                    powerDataContent.innerHTML = mapHTML + '<div class="loading-power">❌ 데이터 처리 실패</div>';
                }
            }
            // ===== 태양광 발전소 =====
            else if (plant.type === 'solar') {
                try {
                    const plants = Object.keys(solarPowerData);
                    
                    if (plants.length === 0) {
                        powerDataContent.innerHTML = mapHTML + '<div class="loading-power">📊 발전량 데이터가 없습니다</div>';
                        return;
                    }

                    let html = mapHTML + `
                        <div class="unit-selector-container">
                            <label class="unit-selector-label">호기 선택</label>
                            <select class="unit-selector" id="unitSelector">
                                ${plants.map(p => `<option value="${p}">${p}</option>`).join('')}
                            </select>
                        </div>
                        <div id="sliderContainer"></div>
                        <div class="chart-container">
                            <div class="chart-wrapper">
                                <canvas id="powerChart"></canvas>
                            </div>
                        </div>
                    `;
                    
                    powerDataContent.innerHTML = html;
                    
                    const unitSelector = document.getElementById('unitSelector');
                    const sliderContainer = document.getElementById('sliderContainer');
                    let currentDates = [];
                    let currentPlantData = null;
                    
                    function updateSlider() {
                        stopPlayback();
                        const selectedPlant = unitSelector.value;
                        currentPlantData = solarPowerData[selectedPlant];
                        
                        if (currentPlantData) {
                            currentDates = Object.keys(currentPlantData).sort();
                            const formattedDates = currentDates.map(d => {
                                const dateObj = new Date(d);
                                return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
                            });
                            
                            sliderContainer.innerHTML = createTimeSlider(formattedDates, unitSelector, currentPlantData, selectedPlant, false);
                            
                            const yearSlider = document.getElementById('yearSlider');
                            const timeSlider = document.getElementById('timeSlider');
                            const yearDisplay = document.getElementById('yearDisplay');
                            const timeDisplay = document.getElementById('timeDisplay');
                            const playButton = document.getElementById('playButton');
                            
                            createYearMarkers(formattedDates);
                            createTimeMarkers();
                            
                            function updateChart(dateIndex, hourIndex) {
                                const selectedDate = currentDates[dateIndex];
                                const dateObj = new Date(selectedDate);
                                const displayDate = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
                                
                                yearDisplay.textContent = displayDate;
                                timeDisplay.textContent = hourIndex + '시';
                                
                                const hourlyData = currentPlantData[selectedDate];
                                if (!hourlyData) return;
                                
                                const chartData = Object.entries(hourlyData)
                                    .sort(([a], [b]) => Number(a) - Number(b))
                                    .slice(0, hourIndex + 1)
                                    .map(([hour, value]) => ({
                                        year: Number(hour),
                                        value: Number(value)
                                    }));
                                
                                createPowerChart('powerChart', chartData, `${selectedPlant} - ${displayDate} ${hourIndex}시까지`);
                            }
                            
                            yearSlider.addEventListener('input', function() {
                                updateChart(parseInt(this.value), parseInt(timeSlider.value));
                            });
                            
                            timeSlider.addEventListener('input', function() {
                                updateChart(parseInt(yearSlider.value), parseInt(this.value));
                            });
                            
                            playButton.addEventListener('click', function() {
                                startPlayback(yearSlider, timeSlider, currentDates, updateChart);
                            });
                            
                            updateChart(0, 0);
                        }
                    }
                    
                    unitSelector.addEventListener('change', updateSlider);
                    updateSlider();
                    
                } catch (error) {
                    console.error('❌ 태양광 데이터 처리 실패:', error);
                    powerDataContent.innerHTML = mapHTML + '<div class="loading-power">❌ 데이터 처리 실패</div>';
                }
            }
            // ===== 풍력 발전소 =====
            else if (plant.type === 'wind') {
                try {
                    const plants = Object.keys(windPowerData);
                    
                    if (plants.length === 0) {
                        powerDataContent.innerHTML = mapHTML + '<div class="loading-power">📊 발전량 데이터가 없습니다</div>';
                        return;
                    }

                    let html = mapHTML + `
                        <div class="unit-selector-container">
                            <label class="unit-selector-label">호기 선택</label>
                            <select class="unit-selector" id="unitSelector">
                                ${plants.map(p => `<option value="${p}">${p}</option>`).join('')}
                            </select>
                        </div>
                        <div class="date-selector-container">
                            <label class="date-selector-label">데이터 표시 방식 선택</label>
                            <select class="date-selector" id="dateSelector">
                                <option value="daily">일별 + 시간대별 데이터</option>
                                <option value="yearly">연도별 누적 데이터</option>
                            </select>
                        </div>
                        <div id="sliderContainer"></div>
                        <div class="chart-container">
                            <div class="chart-wrapper">
                                <canvas id="powerChart"></canvas>
                            </div>
                        </div>
                    `;
                    
                    powerDataContent.innerHTML = html;
                    
                    const unitSelector = document.getElementById('unitSelector');
                    const dateSelector = document.getElementById('dateSelector');
                    const sliderContainer = document.getElementById('sliderContainer');
                    let currentDates = [];
                    let currentPlantData = null;
                    
                    function updateSlider() {
                        stopPlayback();
                        const selectedPlant = unitSelector.value;
                        const displayMode = dateSelector.value;
                        currentPlantData = windPowerData[selectedPlant];
                        
                        if (currentPlantData) {
                            if (displayMode === 'daily') {
                                // 일별 + 시간대별 모드
                                currentDates = Object.keys(currentPlantData).sort();
                                const formattedDates = currentDates.map(d => {
                                    const dateObj = new Date(d);
                                    return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
                                });
                                
                                sliderContainer.innerHTML = createTimeSlider(formattedDates, unitSelector, currentPlantData, selectedPlant, false);
                                
                                const yearSlider = document.getElementById('yearSlider');
                                const timeSlider = document.getElementById('timeSlider');
                                const yearDisplay = document.getElementById('yearDisplay');
                                const timeDisplay = document.getElementById('timeDisplay');
                                const playButton = document.getElementById('playButton');
                                
                                createYearMarkers(formattedDates);
                                createTimeMarkers();
                                
                                function updateChart(dateIndex, hourIndex) {
                                    const selectedDate = currentDates[dateIndex];
                                    const dateObj = new Date(selectedDate);
                                    const displayDate = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
                                    
                                    yearDisplay.textContent = displayDate;
                                    timeDisplay.textContent = hourIndex + '시';
                                    
                                    const hourlyData = currentPlantData[selectedDate];
                                    if (!hourlyData) return;
                                    
                                    const chartData = Object.entries(hourlyData)
                                        .sort(([a], [b]) => Number(a) - Number(b))
                                        .slice(0, hourIndex + 1)
                                        .map(([hour, value]) => ({
                                            year: Number(hour),
                                            value: Number(value)
                                        }));
                                    
                                    createPowerChart('powerChart', chartData, `${selectedPlant} - ${displayDate} ${hourIndex}시까지`);
                                }
                                
                                yearSlider.addEventListener('input', function() {
                                    updateChart(parseInt(this.value), parseInt(timeSlider.value));
                                });
                                
                                timeSlider.addEventListener('input', function() {
                                    updateChart(parseInt(yearSlider.value), parseInt(this.value));
                                });
                                
                                playButton.addEventListener('click', function() {
                                    startPlayback(yearSlider, timeSlider, currentDates, updateChart);
                                });
                                
                                updateChart(0, 0);
                            } else {
                                // 연도별 누적 모드
                                const yearlyData = {};
                                
                                Object.entries(currentPlantData).forEach(([date, hours]) => {
                                    const year = date.substring(0, 4);
                                    if (!yearlyData[year]) yearlyData[year] = 0;
                                    
                                    Object.values(hours).forEach(value => {
                                        yearlyData[year] += Number(value);
                                    });
                                });
                                
                                const years = Object.keys(yearlyData).sort();
                                const formattedYears = years.map(y => y + '년');
                                
                                sliderContainer.innerHTML = `
                                    <div class="slider-controls">
                                        <div class="slider-container" style="width: 90%;">
                                            <div class="year-display" id="yearDisplay">${formattedYears[0]}</div>
                                            <div class="year-markers" id="yearMarkers"></div>
                                            <input type="range" 
                                                id="yearSlider" 
                                                min="0" 
                                                max="${years.length - 1}" 
                                                value="0" 
                                                step="1" />
                                            <div class="year-range">
                                                <span>${formattedYears[0]}</span>
                                                <span>${formattedYears[formattedYears.length - 1]}</span>
                                            </div>
                                            <div class="play-controls">
                                                <button class="play-button" id="playButton">
                                                    <i class='bx bx-play'></i>
                                                    <span>재생</span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                `;
                                
                                const yearSlider = document.getElementById('yearSlider');
                                const yearDisplay = document.getElementById('yearDisplay');
                                const playButton = document.getElementById('playButton');
                                
                                createYearMarkers(formattedYears);
                                
                                function updateChart(yearIndex) {
                                    yearDisplay.textContent = formattedYears[yearIndex];
                                    
                                    const chartData = years.slice(0, yearIndex + 1).map(year => ({
                                        year: Number(year),
                                        value: yearlyData[year]
                                    }));
                                    
                                    createPowerChart('powerChart', chartData, `${selectedPlant} 연도별 발전량`);
                                }
                                
                                yearSlider.addEventListener('input', function() {
                                    updateChart(parseInt(this.value));
                                });
                                
                                playButton.addEventListener('click', function() {
                                    if (isPlaying) {
                                        stopPlayback();
                                        return;
                                    }
                                    
                                    isPlaying = true;
                                    this.innerHTML = '<i class="bx bx-pause"></i><span>정지</span>';
                                    this.classList.add('playing');
                                    
                                    playInterval = setInterval(() => {
                                        let currentYear = parseInt(yearSlider.value);
                                        if (currentYear >= years.length - 1) {
                                            currentYear = 0;
                                        } else {
                                            currentYear++;
                                        }
                                        yearSlider.value = currentYear;
                                        updateChart(currentYear);
                                    }, 500);
                                });
                                
                                updateChart(0);
                            }
                        }
                    }
                    
                    unitSelector.addEventListener('change', updateSlider);
                    dateSelector.addEventListener('change', updateSlider);
                    updateSlider();
                    
                } catch (error) {
                    console.error('❌ 풍력 데이터 처리 실패:', error);
                    powerDataContent.innerHTML = mapHTML + '<div class="loading-power">❌ 데이터 처리 실패</div>';
                }
            }
        }

        resetButton.addEventListener('click', () => {
            searchInput.value = '';
            currentFilter = 'all';
            selectedPlant = null;
            
            stopPlayback();
            
            if (currentChart) {
                currentChart.destroy();
                currentChart = null;
            }
            
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelector('.filter-tab[data-type="all"]').classList.add('active');
            
            displaySearchResults(allPowerPlants);
            powerDataContainer.classList.remove('active');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function searchPlants(query) {
            if (!query.trim()) {
                if (currentFilter === 'all') {
                    displaySearchResults(allPowerPlants);
                } else {
                    const filtered = allPowerPlants.filter(p => p.type === currentFilter);
                    displaySearchResults(filtered);
                }
                return;
            }

            let filteredPlants = allPowerPlants;

            if (currentFilter !== 'all') {
                filteredPlants = filteredPlants.filter(p => p.type === currentFilter);
            }

            const searchQuery = query.toLowerCase();
            filteredPlants = filteredPlants.filter(p => 
                p.name.toLowerCase().includes(searchQuery) ||
                p.location.toLowerCase().includes(searchQuery) ||
                p.operator.toLowerCase().includes(searchQuery)
            );

            displaySearchResults(filteredPlants);
        }

        searchInput.addEventListener('input', (e) => {
            searchPlants(e.target.value);
        });

        document.querySelectorAll('.filter-tab').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelector('.filter-tab.active').classList.remove('active');
                button.classList.add('active');
                
                currentFilter = button.dataset.type;
                
                const searchQuery = searchInput.value.trim();
                if (searchQuery) {
                    searchPlants(searchQuery);
                } else {
                    if (currentFilter === 'all') {
                        displaySearchResults(allPowerPlants);
                    } else {
                        const filtered = allPowerPlants.filter(p => p.type === currentFilter);
                        displaySearchResults(filtered);
                    }
                }
            });
        });

        const scrollToTopBtn = document.getElementById('scrollToTop');
        const scrollToBottomBtn = document.getElementById('scrollToBottom');

        scrollToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        scrollToBottomBtn.addEventListener('click', () => {
            window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
        });

        window.addEventListener('scroll', () => {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight;
            const clientHeight = document.documentElement.clientHeight;

            if (scrollTop < 100) {
                scrollToTopBtn.classList.add('hidden');
            } else {
                scrollToTopBtn.classList.remove('hidden');
            }

            if (scrollTop + clientHeight >= scrollHeight - 100) {
                scrollToBottomBtn.classList.add('hidden');
            } else {
                scrollToBottomBtn.classList.remove('hidden');
            }
        });

        window.dispatchEvent(new Event('scroll'));

        loadAllPlants();
    </script>
</body>
</html>
