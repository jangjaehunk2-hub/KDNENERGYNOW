</head>
  <body>
  <h1>⚡ KEPCO 발전량 데이터</h1>
  <p>아래 표는 Functions에서 가져온 발전량 정보입니다.</p>

  <!-- 표 영역 -->
  <table border="1" id="powerTable">
    <thead>
      <tr>
        <th>발전량</th>
        <th>날짜</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
  const API_URL = "https://us-central1-kepcokdn-a5ebf.cloudfunctions.net/getPowerData";

  async function loadPowerData() {
    try {
      const response = await fetch(`${API_URL}?stDt=2024-01&edDt=2025-01`);
      const data = await response.json();
      console.log("⚡ KEPCO 발전량 API 데이터:", data);

      const items = data.response.body.items.item;
      const tbody = document.querySelector("#powerTable tbody");
      tbody.innerHTML = ""; 

      items.forEach(row => {
        // 표에 데이터 표시
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.msr}</td>   
          <td>${row.stdrDe}</td>
        `;
        tbody.appendChild(tr);
      });

    } catch (error) {
      console.error("API 호출 오류:", error);
    }
  }

  loadPowerData();
</script>
</body>
</html>
